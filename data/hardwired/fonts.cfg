#textdomain wesnoth

[fonts]
    # NOTE: font order keys are marked as translatable to allow translators to
    # provide different font orders: one just has to install the missing fonts
    # or add them to wesnoth/fonts.

    #
    # Pango text-related keys.
    #
    # All respective font files are automatically loaded.
    #
    # NOTE: these are technically supposed to be lists to provide fallbacks
    # like the SDL_TTF code did. However, there's a weird bug in Pango itself
    # where a comma separated list of fonts will result in newlines not being
    # rendered and font space metrics being off on Windows.
    #
    # po: This is a font family name Wesnoth uses to render text, not text to translate. Leave it unchanged for Latin, Greek and Cyrillic character sets; add a suitable GPL-compatible font to fonts/ and use that font name here instead for scripts not covered by this font.
    family_order= _ "Lato"
    # po: This is a font family name Wesnoth uses to render monospace text, not text to translate. DejaVu Sans Mono covers Latin, Greek, Cyrillic, Armenian, Georgian and Arabic; add a suitable GPL-compatible font to fonts/ and use that font name here instead for scripts not covered by this font.
    family_order_monospace= _ "DejaVu Sans Mono"
    # po: This is a font family name Wesnoth uses to render calligraphic text, not text to translate. WesScript was derived from Oldania (a Gothic-style font) and covers only Western European Latin (no Greek or Cyrillic, and no letters commonly used in Eastern European languages); add a suitable GPL-compatible font to fonts/ and use that font name here instead for scripts not covered by this font.
    family_order_script = _ "WesScript"
[/fonts]
