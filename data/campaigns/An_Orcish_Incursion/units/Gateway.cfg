#textdomain wesnoth-aoi
[unit_type]
    id=Gateway
    name= _ "Gateway"
    race=undead
    image=halo/air-lightning/0030.png
    hitpoints=0
    hp_bar_scaling=0
    xp_bar_scaling=0
    alignment=chaotic
    cost=0
    level=0
    movement=0
    [resistance]
        blade=100
        pierce=100
        impact=100
        cold=100
        fire=100
        arcane=60
    [/resistance]
    description= _ "A work of madness..."
    ellipse=none
    [standing_anim]
        [frame]
            duration=18000
            image="halo/air-clouds/0[001~210].png"
            image_mod=~O(0.3)
        [/frame]
        [lightning_frame]
            duration=3000
            # frames 1-3 are identical, so skip them
            image="halo/air-lightning/00[04~45].png"
            image_mod=~SCALE(152,152)~O(0.3)
            layer=99
            offset=0.0
        [/lightning_frame]
        [halo1_frame]
            duration=1000
            image="halo/spirits/00[01~24].png"
            auto_vflip=no
            image_mod=~BLEND(0,0,0,1.0)
        [/halo1_frame]
        [halo2_frame]
            duration=3000
            image="projectiles/secrethit.png"
            auto_vflip=no
            image_mod=~SCALE_INTO(144,144)~BLEND(255,0,0,1.0)
        [/halo2_frame]
        [halo3_frame]
            duration=3000
            image="halo/particle-anims/particle-b2-[01~73].png"
            auto_vflip=no
            x,y=1,-5
            image_mod=~SCALE_INTO(144,144)~BLEND(0,0,0,1.0)~O(0.8)
        [/halo3_frame]
    [/standing_anim]
[/unit_type]
