#textdomain wesnoth-aoi

# Warning: If you are not a native and literate English speaker, do
# not try to modify the storyline text. It is deliberately written
# in a somewhat archaic and poetic form of English, and some previous
# attempts to "fix" it inflicted damage that was difficult to undo.

#
# most of this map's villages start under enemy control, but are
# deliberately placed to the south and east - out of the direct line of battle
# this is to encourage the player to prioritize village control
# rather than prioritizing enemy leaders (which usually makes for less exciting games)
#
# of note are the several villages to the southeast of the south leader, so the player can still push in without Druids
# and the villages/oases near the north leader, so his soldiers can heal if after getting poisoned
#

#define TURN_LIMIT
26#enddef

[scenario]
    id=02_Wasteland
    name= _ "Wasteland"
    map_file=02_Wasteland.map
    turns={TURN_LIMIT}
    next_scenario=03_Valley_of_Trolls
    {DEFAULT_SCHEDULE_MORNING}

    {SCENARIO_MUSIC       northerners.ogg}
    {EXTRA_SCENARIO_MUSIC frantic.ogg}
    {EXTRA_SCENARIO_MUSIC casualties_of_war.ogg}
    {EXTRA_SCENARIO_MUSIC nunc_dimittis.ogg}

    [story]
        [part]
            music=northerners.ogg
            background=story/wesmere.webp
            story= _ "The path of the orcish war band was easy to follow — a wide swathe of trampled ground through violated forest. Erlornas and his party swiftly followed it north and west."
        [/part]
        [part]
            background=story/wesmere.webp
            story= _ "As they fared further north the green forest thinned around them, slowly fading into a barren and fallow country. The signs were obvious and unmistakable — tree stumps, an occasional half-rotten tree felled long ago, and dead wood around them in scarce grass. This had been forest once, like the woods they called home. It had been murdered."
        [/part]
        [part]
            background=story/wesmere.webp
            story= _ "There was no trail to be found here; wind and rain had erased the spoor. Fortunately, there was no need of a trail; smoke on the horizon betrayed the presence of their enemies."
        [/part]
        [part]
            background=story/wesmere.webp
            story= _ "Erlornas was near-certain they would find orcs there. No clan of dwarves would break their ancient treaties with the elves in this way; humans were never so... methodical in their destruction, and did not travel in sufficiently large numbers in a north country they found too cold and damp for comfort. The great question remained — would he find Rualsha?"
        [/part]
        [part]
            background=story/wesmere.webp
            story= _ "Perhaps, but not here. The tribe this camp housed was too small to impress fear on other orcs. Come next morning, the elves were prepared for battle."
        [/part]
    [/story]
    {AOI_TRACK {JOURNEY_02_NEW}}

    ###########################################################################
    #                                  DEFINE SIDES
    ###########################################################################
    {PLAYER_SIDE}

    #############################
    # RUALSHA ORCS
    #############################
    [side]
        side=2
        color={RUALSHA_COLOR}
        controller=ai
        recruit=Orcish Assassin
        # very high income (except on Easy). That way, if the player picks off one leader too soon,
        # the other leader's income (no longer balanced by the other AI) may cause issues
        gold={ON_DIFFICULTY4 50 100 150 200}
        income={ON_DIFFICULTY4 0 13 20 28}
        team_name=rualsha_orcs
        user_team_name= _ "Orcs"
        {FLAG_VARIANT6 ragged}

        type=Orcish Slayer
        id=Gharlsa
        name=_ "Gharlsa"
        # usually orcs don't get Dim, but this guy's
        # dialogue is so odd that Dim seems appropriate
        {MODIFICATIONS( {TRAIT_DIM} {TRAIT_RESILIENT} )}
        facing=se

        {REGROUP_MAI_DEFAULTS retreat_tod=daytime}
    [/side]
    {STARTING_VILLAGES_AREA 2 0-99 0-6 0}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Orcish Archer" {ON_DIFFICULTY4 2 3 4 5}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Wolf Rider"    {ON_DIFFICULTY4 1 1 2 2}}

    #############################
    # SELMAR ORCS
    #############################
    [side]
        side=3
        color={SELMAR_COLOR}
        controller=ai
        hidden=yes
        recruit=Orcish Grunt
        # very high income (except on Easy). That way, if the player picks off one leader too soon,
        # the other leader's income (no longer balanced by the other AI) may cause issues
        gold={ON_DIFFICULTY4 50 100 150 200}
        income={ON_DIFFICULTY4 0 13 20 28}
        team_name=selmar_orcs
        user_team_name= _ "Rival Orcs"
        {FLAG_VARIANT6 ragged}

        type={ON_DIFFICULTY4 "Orcish Warrior" "Orcish Warlord" "Orcish Warlord" "Orcish Warlord"}
        id=Krughnar
        name= _ "Krughnar"
        {MODIFICATIONS( {TRAIT_STRONG} {TRAIT_INTELLIGENT} )}
        facing=sw

        {REGROUP_MAI_DEFAULTS retreat_tod=daytime}
    [/side]
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Goblin Spearman" {ON_DIFFICULTY4 2 4 6 8}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Wolf Rider"      {ON_DIFFICULTY4 1 1 2 2}}

    [event]
        name=prestart
        # seek leader, not side. That helps keep the AI-vs-AI battle on the west side of the river
        {MODIFY_SIDE_AI 2 (
            [goal]
                [criteria]
                    side=3
                    canrecruit=yes
                [/criteria]
                value=0.2
            [/goal]
        )}
        {MODIFY_SIDE_AI 3 (
            [goal]
                [criteria]
                    side=2
                    canrecruit=yes
                [/criteria]
                value=5
            [/goal]
        )}
        {MODIFY_SIDE_AI 2,3 (
            [avoid]
                terrain=W*^*
                [not]
                    terrain=Wwf^*
                [/not]
            [/avoid]
        )}
    [/event]

    ###########################################################################
    #                                  PREPARE MAP
    ###########################################################################
    [event]
        name=prestart
        [store_unit]
            {FILTER id=Krughnar}
            kill=yes
            variable=stored_Krughnar
        [/store_unit]
        {GUARANTEE_ADVISOR}
        {MODIFY_UNIT side=1 facing nw}
    [/event]

    ###########################################################################
    #                              PLAY SCENARIO
    ###########################################################################
    [event]
        name=start
        [message]
            role=advisor
            message= _ "The trail leads straight to this place, my lord."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "There is a keep ahead of us. How comes it that we know nothing of it? I thought our borders were watched more carefully."
        [/message]
        [message]
            role=advisor
            message= _ "I... I know not, my lord. For ages there was no one in these lands that could build such a thing save us. I fear we have fallen prey a false sense of security that has injured the vigilance of our scouts."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "When the fighting ends, I’ll have some answers. But for now—"
        [/message]
        [message]
            speaker=Gharlsa
            message= _ "Gharlsa sees elves... yes... Fresh meat for wolves. Yes, yes..."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "—let’s focus on the task at hand."
        [/message]
        [message]
            role=advisor
            message= _ "Does that demented creature truly believe he can kill us?"
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Appearances can be deceiving. Tell the men to be cautious."
        [/message]

        #############################
        # OBJECTIVES
        #############################
        [objectives]
            [objective]
                description= _ "Defeat Gharlsa"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Erlornas"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
#ifdef EASY
            [note]
                description=_"Assassins are hard to hit, and their poison is insidious. Stay close to the villages, where poisoning can be cured, and force your enemies to attack you from the river."
            [/note]
#endif
        [/objectives]
    [/event]

    ###########################################################################
    #                              RIVAL ORCS ARRIVE
    ###########################################################################
    [event]
        name=side 2 turn end
        #############################
        # STORE AND REPLACE MAP
        #############################
        [store_unit]
            [filter]
                {NOT_ON_RECALL_LIST}
            [/filter]
            variable=stored_s03_units
            kill=yes
        [/store_unit]
        [store_locations]
            terrain=*^V*
            variable=stored_s03_villages
        [/store_locations]
        [replace_map]
            map_file=02b_Wasteland.map
            expand=yes
        [/replace_map]

        # adjust and unstore units
        [foreach]
            array=stored_s03_units
            [do]
                {VARIABLE this_item.goto_y "$( $this_item.goto_y + 17 )"}
                [unstore_unit]
                    variable=this_item
                    find_vacant=yes
                    check_passability=yes
                    x=$this_item.x
                    y="$( $this_item.y + 17 )"
                [/unstore_unit]
            [/do]
        [/foreach]
        [foreach]
            array=stored_s03_villages
            [do]
                [capture_village]
                    side=$this_item.owner_side
                    x=$this_item.x
                    y="$( $this_item.y + 17 )"
                [/capture_village]
            [/do]
        [/foreach]
        {CLEAR_VARIABLE stored_s03_units,stored_s03_villages}

        #############################
        # CREATE RIVAL ORCS
        #############################
        [modify_side]
            side=3
            hidden=no
        [/modify_side]
        [unstore_unit]
            variable=stored_Krughnar
            x,y=15,1
            animate=yes
        [/unstore_unit]
        {CLEAR_VARIABLE stored_Krughnar}
        {MOVE_UNIT id=Krughnar 18 4}
        [capture_village]
            side=3
            y=0-13
        [/capture_village]
        # the new map has a village between 14-17 that should belong to side 2, not 3
        [capture_village]
            side=2
            y=14-17
        [/capture_village]

        #############################
        # INTRODUCE RIVAL ORCS
        #############################
        [message]
            speaker=Krughnar
            #po: Krughnar is a follower of Lich-Lord Selmar. He calls the other orcs traitors because they've rebelled, and follow Rualsha instead. The player doesn't know this yet.
            message= _ "I have caught you at last, traitorous Gharlsa! May your spirit suffer greatly for your weakness!"
        [/message]
        [message]
            speaker=Gharlsa
            #po: Gharlsa is a follower of Rualsha, another orc - not the Lich-Lord Selmar that Krughnar follows. The player doesn't know this yet.
            #po: "orcs only obey orcs" is also a similar theme to what Rualsha says in the final scenario
            message= _ "Traitor? No... you betray. Gharlsa only obey orcs. Rualsha great orc. Yes, yes... Rualsha true leader."
        [/message]
        [message]
            speaker=Krughnar
            message= _ "Rise up, grunts! We have a great fight upon us! Let your rage flow freely! Let your blades slay all! First one to draw blood will feast by my fire this night!"
        [/message]
        # rival orcs take their turn and recruit
        [event]
            name=side 3 turn end
            {GENERIC_UNITC 3 ({ON_DIFFICULTY4 "none"            "Goblin Spearman" "Orcish Grunt" "Orcish Grunt"  }) 16 2 ({FACING se}{ANIMATE}{ROLE mai_guard})}
            {GENERIC_UNITC 3 ({ON_DIFFICULTY4 "Goblin Spearman" "Orcish Grunt"    "Orcish Grunt" "Orcish Warrior"}) 18 7 ({FACING se}{ANIMATE}{ROLE mai_guard})}

            #############################
            # ERLORNAS REACTS
            #############################
            [message]
                speaker=Erlornas
                message= _ "It seems this “Rualsha’s” leadership does not stand uncontested. The orcs have turned their attention from us to their rival. The two camps mean to destroy each other, and much of our forest in the process."
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Aim true, men, with wit and courage the day will be ours. And spare no-one, there can be no orc south of the hills, else we’ll never have peace again."
            [/message]

            #############################
            # OBJECTIVES
            #############################
            [objectives]
                [objective]
                    description= _ "Defeat both enemy leaders"
                    condition=win
                [/objective]
                [objective]
                    description= _ "Death of Erlornas"
                    condition=lose
                [/objective]
                {TURNS_RUN_OUT}
                [gold_carryover]
                    bonus=yes
                    carryover_percentage=40
                [/gold_carryover]
#ifdef EASY
                [note]
                    description=_"Your enemies are focused on each other. Gather gold and build your army while they exhaust their armies, then move in and finish them off."
                [/note]
#endif
            [/objectives]
        [/event]
    [/event]

    #############################
    # ASSASSIN FLAVOR
    #############################
    [event]
        name=attack
        [filter]
            type=Orcish Assassin
        [/filter]
        [filter_second]
            side=3
        [/filter_second]
        [message]
            speaker=Gharlsa
            message= _ "Yes... yes... Slay them!"
        [/message]
    [/event]

    ###########################################################################
    #                              VICTORY / DEFEAT
    ###########################################################################
    #############################
    # ASSASSIN (SOUTH) LEADER DIES
    #############################
    [event]
        name=last breath
        [filter]
            id=Gharlsa
        [/filter]
        [message]
            speaker=unit
            message= _ "Hurts... failed... Rualsha gonna be angry..."
        [/message]
        {VARIABLE s02_Gharlsa_death_turn $turn_number}
        {FIRE_EVENT check_for_victory}
    [/event]

    #############################
    # WARRIOR (NORTH) LEADER DIES
    #############################
    [event]
        name=last breath
        [filter]
            id=Krughnar
        [/filter]
        [message]
            speaker=unit
            message= _ "You won... Elf... But it changes... Nothing... (*cough*)"
        [/message]
        [message]
            speaker=unit
            message= _ "We found the way... Now... We will come in numbers... (*cough*) You can’t imagine..."
        [/message]
        [message]
            speaker=unit
            message= _ "(*cough*) I’ll be waiting... Among the dead..."
        [/message]
        {VARIABLE s02_Krughnar_death_turn $turn_number}
        {FIRE_EVENT check_for_victory}
    [/event]

    #############################
    # BOTH ORC LEADERS ARE DEAD
    #############################
    [event]
        name=check_for_victory
        [event]
            name=die
            [filter_condition]
                [not]
                    [have_unit]
                        side=2,3
                        canrecruit=yes
                    [/have_unit]
                [/not]
            [/filter_condition]

            {IF_VAR s02_Gharlsa_death_turn equals $s02_Krughnar_death_turn (
                [then]
                    {ACHIEVE s02}
                [/then]
            )}
            {CLEAR_VARIABLE s02_Gharlsa_death_turn,s02_Krughnar_death_turn}

            [message]
                speaker=narrator
                image=wesnoth-icon.png
                message= _ "The orcish chieftain finally fell, overcome by his wounds. The elves found themselves in a half-ruined camp littered with the bodies of both sides, there was no hale orc in sight, nor did any of the wounded beg mercy. The elves took no prisoners."
            [/message]
            # not CUSCENE_ENEMIES_RETREAT, or else the "No-one tried to escape" line doesn't make sense
            {KILL side=2 ANIMATE=yes}
            {KILL side=3 ANIMATE=yes}
            {DELAY 500}
            {GUARANTEE_ADVISOR}
            [message]
                role=advisor
                message= _ "It’s done, lord. No-one escaped. No-one tried to escape. I’m... disturbed."
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Good. But their disregard for self-preservation is astounding. As is their ferocity when defending what they claim as their own. Have the scouts found others this side of the hills?"
            [/message]
            [message]
                role=advisor
                message= _ "No, lord. But trolls were spotted in the hills ahead. Do we really need to cross them to the north?"
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Yes. The council has spoken to me through a dream-sending. They are troubled. Reinforcements have been sent after us, but we need to press on. Tell the men to rest, we’ll move out at dawn."
            [/message]
            [endlevel]
                result=victory
                bonus=yes
                {NEW_GOLD_CARRYOVER 40}
            [/endlevel]
        [/event]
    [/event]

    #############################
    # TIME OVER
    #############################
    [event]
        name=side 1 turn {TURN_LIMIT} end
        {GUARANTEE_ADVISOR}
        [message]
            role=advisor
            message= _ "We can’t carry on, lord, the men are too tired. We have to fall back."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Sound the retreat, we’ll try again when reinforcements arrive."
        [/message]
        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message= _ "The expected relief caught up with them a few days later. The following morning they took the field against a far larger host of orcs. The battle ended in a draw; the war raged on for years..."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]

#undef TURN_LIMIT
