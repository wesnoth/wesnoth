#textdomain wesnoth-aoi

# Warning: If you are not a native and literate English speaker, do
# not try to modify the storyline text. It is deliberately written
# in a somewhat archaic and poetic form of English, and some previous
# attempts to "fix" it inflicted damage that was difficult to undo.

#define TURN_LIMIT
24#enddef

[scenario]
    id=04_Linaera_the_Quick
    name= _ "Linaera the Quick"
    map_file=04_Linaera_the_Quick.map
    turns={TURN_LIMIT}
    next_scenario=05_A_Detour_through_the_Swamp
    {DEFAULT_SCHEDULE_AFTERNOON}

    {SCENARIO_MUSIC       knolls.ogg}
    {EXTRA_SCENARIO_MUSIC traveling_minstrels.ogg}
    {EXTRA_SCENARIO_MUSIC legends_of_the_north.ogg}

    [story]
        [part]
            music=wanderer.ogg
            {AOI_BIGMAP}
            story= _ "After a day of hard-earned rest the elves marched north again. This was unknown country, not frequented even by Wesmere’s furthermost-faring scouts."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "Two days’ travel later, the forward scouts reported another orcish warband laying siege to a tower."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "Erlornas surveyed the siege from atop a small tree-covered hill overlooking the tower valley..."
        [/part]
    [/story]
    {AOI_TRACK {JOURNEY_04_NEW}}

    ###########################################################################
    #                                  DEFINE SIDES
    ###########################################################################
    {PLAYER_SIDE}

    #############################
    # ORCS
    #############################
    [side]
        side=2
        color={RUALSHA_COLOR}
        controller=ai
        recruit=Orcish Warrior,Orcish Crossbowman

        # high gold, low income, and starts with many villages
        # beat the initial wave and take map control to starve the AI
        gold={ON_DIFFICULTY4 85 175 265 350}
        income={ON_DIFFICULTY4 0 2 4 6}
        team_name=orcs
        user_team_name= _ "Orcs"
        {FLAG_VARIANT6 ragged}

        type=Orcish Warlord
        id=Gnargha
        name= _ "Gnargha"
        canrecruit=yes
        {MODIFICATIONS( {TRAIT_RESILIENT} {TRAIT_STRONG} )}
        facing=se

        {REGROUP_MAI_DEFAULTS (
            retreat_tod=daytime
            leader_protect_radius=4 # so we help protect the 13,5 guard
        )}
    [/side]
    {STARTING_VILLAGES_AREA 2  0-99 0-10 0}
    {STARTING_VILLAGES_AREA 2  0-10 0-99 0}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Wolf Rider"    {ON_DIFFICULTY4 1 2 1 0}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Goblin Knight" {ON_DIFFICULTY4 0 0 1 2}}

    # recruit L2s initially so we can quickly spend our gold without being limited by keep size
    # once our initial gold is spent, switch to cheaper L1s
    [event]
        name=turn 4
        [modify_side]
            side=2
            recruit=Orcish Grunt,Orcish Archer
        [/modify_side]
    [/event]

    #############################
    # MAGES
    #############################
    [side]
        side=3
        color=red # red is the color of Wesnoth
        controller=ai
        hidden=yes
        team_name=mages
        user_team_name= _ "Mages"
        # wmllint: recognize Linaera
        {CHARACTER_STATS_LINAERA}
        facing=ne
    [/side]
    {STARTING_VILLAGES 3 0}

    #############################
    # DUMMY AI-FIX SIDE
    #############################
    # by default, the AI will try to capture the middle village (in Linaera's tower)
    # the AI can't get there, so it'll end up leaving several units hanging around doing nothing - and the problem gets worse if Linaera herself is there
    [side]
        side=4
        color=green
        controller=null
        hidden=yes
        no_leader=yes
        team_name=elves,orcs
    [/side]
    [event]
        name=side 2 turn
        first_time_only=no
        {MODIFY_UNIT x,y=8,6 side 4}
        [capture_village]
            x,y=8,6
            # switch to neutral. Can't switch to side 4, since side 4 has no leader
        [/capture_village]
    [/event]
    [event]
        name=side 2 turn end
        first_time_only=no
        {MODIFY_UNIT x,y=8,6 side 1}
        [capture_village]
            x,y=8,6
            side=1
        [/capture_village]
    [/event]

    ###########################################################################
    #                                  PREPARE MAP
    ###########################################################################
    [event]
        name=prestart
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "Orcish Grunt"  "Orcish Warrior"     "Orcish Warrior"    } 13 5 ({FACING se}{ROLE mai_guard})}
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "Orcish Archer" "Orcish Crossbowman" "Orcish Crossbowman"}  5 5 ({FACING sw}{ROLE mai_guard})}
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "none"          "Orcish Archer"      "Orcish Crossbowman"} 11 9 ({FACING se}{GUARDIAN})}
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "Orcish Grunt"  "Orcish Grunt"       "Orcish Warrior"    } 10 8 ({FACING sw}{GUARDIAN})}
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "none"          "none"               "Orcish Grunt"      } 11 8 ({FACING se}{GUARDIAN})}
        [event]
            name=turn 3
            # hold our positions until our recruited soldiers are ready to fight too
            {MODIFY_UNIT side=2 status.guardian no}
        [/event]

        {GUARANTEE_ADVISOR}
        {MODIFY_UNIT side=1 facing nw}
    [/event]

    ###########################################################################
    #                              PLAY SCENARIO
    ###########################################################################
    [event]
        name=start
        #############################
        # EXAMINING THE TOWER
        #############################
        [message]
            speaker=Erlornas
            message= _ "Report."
        [/message]
        {SCROLL_TO 8 6}
        [message]
            role=advisor
            scroll=no
            message= _ "A warband of orcs, no women or children among them, besieges a tower. It’s of human design... but we are far from the lands granted to humans by treaty, my lord Erlornas."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Under the letter of the treaty, it is so. But this country is too cold and barren for us. I wonder, what manner of human would choose to live here, far from its kind? Hmmm..."
        [/message]
        [message]
            role=advisor
            message= _ "It trespasses, and should be driven out!"
        [/message]
        [message]
            speaker=Erlornas
            message= _"Hold. It is only one human, or a few of them at most. Time enough to speak of driving it out when we have no enemies in common."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Tell me: I see no bridge over the chasm around that keep. Is there any sign that one has been withdrawn by the defenders?"
        [/message]
        [message]
            role=advisor
            message= _ "No, lord. No traces of any construction. It looks like no bridge has ever existed there. There must be other, hidden means of access to the tower."
        [/message]
        [message]
            speaker=Erlornas
            # glasses => wineglasses
            message= _ "Interesting... Go to my personal stores and bring me a bottle of wine. And a couple of glasses."
        [/message]
        [message]
            role=advisor
            # wineglasses
            message= _ "... Glasses?"
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Do it. We’ll have a guest soon."
        [/message]
        {SCREEN_FADER 0,0,0 255 1000}
        {DELAY 500}
        [message]
            speaker=narrator
            message="<i>" +
                #po: "Faerie" in this paragraph is a rare, poetic word in
                #po: English. It is the proper name of a magical otherworld
                #po: associated with elves - actually, originally with
                #po: fairies, but before Tolkien the boundary between elves
                #po: and fairies was extremely blurry. In Wesnoth it is
                #po: deliberately unclear whether Faerie is a place that is
                #po: the source of magical power or a label for the inner
                #po: nonhuman/magical nature of the Elves. Translate freely.
                _ "Erlornas closed his eyes and brought his hands forward, joined palms forming a cup open to the sky. Soon they began to glow, then to flare like a brazier with the fire of Faerie, casting a cold, blue light all around the elf-lord. A wisp of light emerged from the eerie flames, and at a few murmured words from the elf-lord flew away towards the tower below. Then the light around Erlornas faded and all was seemingly as before." + "</i>"
        [/message]
        [message]
            speaker=narrator
            message="<i>" + _ "Some time later..." + "</i>"
        [/message]
        {DELAY 500}
        {SCREEN_FADER 0,0,0 0 1000}

        #############################
        # SPEAKING WITH LINAERA
        #############################
        {MODIFY_UNIT id=Linaera facing se}
        [teleport]
            {FILTER id=Linaera}
            # 20,16 is a village, to fit with how the Teleport ability works
            x,y=20,16
            animate=yes
        [/teleport]
        {MOVE_UNIT id=Linaera 24 16}
        [modify_side]
            side=3
            team_name=elves
        [/modify_side]
        {GENERIC_UNIT 3 Mage 24 15} {GENDER   male} {FACING se}
        {GENERIC_UNIT 3 Mage 23 16} {GENDER female} {FACING se}
        [message]
            speaker=Erlornas
            message=_ "So you decided to accept the invitation. Good. Welcome, I am Lord Erlornas of Wesmere. I find your presence here... surprising."
        [/message]
        [message]
            speaker=Linaera
            message= _ "Scarcely less than I find yours, my lord elf, but I would welcome your aid against these orcs. They have been besieging my tower for weeks. I dare not flee lest they chase me down."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "I wish their foul kind driven as far as possible from my borders, not to return. But you will explain your presence here before petitioning my aid. These lands are not of those that were appointed to man."
        [/message]
        [message]
            speaker=Linaera
            #po: "some import" (import having identical meaning as"importance") is under-selling it; a Lich-Lord is a very serious danger.
            message= _ "My apprentices and I have come to reconnoiter, regarding a danger of some import. Perhaps you have sensed it too; black magic is in the air. A Lich-Lord of the Green Isle holds dominion in these lands."
        [/message]
        [message]
            role=advisor
            #po: The speaker is an elf, referring to a human king as "man-king" in the same way that a human might refer to an elf as an "elf-king".
            message= _ "Preposterous. Lich-Lord Jevyan perished close to a decade ago, at the hands of your man-king."
        [/message]
        [message]
            speaker=Linaera
            #po: This is Lich-Lord Selmar from WoF.
            message= _ "This one calls himself Selmar. In his lair, he has opened a great stone gate to the heart of the homeland of the orcs in the distant west. I probed the gateway from afar for many days, before these orcs beheld me and pursued."
        [/message]
        [message]
            speaker=Erlornas
            #po: "those whose flesh can cross a chasm as easily as can a thought cross the mind" is a poetic way of referring to Linaera's teleportation.
            message= _ "More than probed, I see you have gleaned from its secrets. Few are those whose flesh can cross a chasm as easily as can a thought cross the mind."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Silver magic — now I understand. So this is how these orcs have returned to trouble us. If what you speak is true, I am certain the Council would agree: this Lich-Lord must be slain and his portal quenched."
        [/message]
        [message]
            role=advisor
            message= _ "And what of Rualsha? The spectre of that name has haunted us ever since our first encounter with these beasts."
        [/message]
        [message]
            speaker=Linaera
            message= _ "That seems an orcish name, but I do not know its owner. I have been trapped here for weeks, unable to reconnoiter nor report home."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Very well. Your petition for aid is granted, Linaera of the folk of Haldric. Count me as an ally and we will defeat this threat together, beginning here."
        [/message]
        {MODIFY_UNIT side=3 side 1}
        {TRANSFER_VILLAGE_OWNERSHIP 3 1}
        [object]
            {FILTER id=Erlornas}
            duration=turn
            image="misc/blank-hex.png~SCALE(72,72)~BLIT(units/human-magi/mage.png~RC(magenta>red),-10,-10)~BLIT(units/human-magi/mage+female.png~RC(magenta>red),10,10)"
            name=_"New Recruits"
            description=_"You can now recruit Mages." + "
" + _"Both Erlornas and Linaera can recruit and recall when standing on a keep."
        [/object]
        [redraw][/redraw]

        #############################
        # OBJECTIVES
        #############################
        [objectives]
            [objective]
                description= _ "Defeat Gnargha"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Erlornas or Linaera"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]

    #############################
    # ACHIEVEMENT
    #############################
    [event]
        name=side 1 turn end
        [filter_condition]
            [not]
                [have_unit]
                    id=Linaera
                    x,y=8,6
                [/have_unit]
            [/not]
        [/filter_condition]
        {VARIABLE s04_failed_achievement yes}
    [/event]

    ###########################################################################
    #                              VICTORY / DEFEAT
    ###########################################################################
    #############################
    # NORTH TROLL LEADER DIES
    #############################
    [event]
        name=last_breath
        [filter]
            id=Gnargha
        [/filter]
        {IF_VAR s04_failed_achievement not_equals yes (
            [then]
                {ACHIEVE s04}
            [/then]
        )}
        {CLEAR_VARIABLE s04_failed_achievement}

        [event]
            name=die
            {CUTSCENE_ENEMIES_RETREAT 2  1 "$($this_item.y)"}
            {GUARANTEE_ADVISOR}
            [message]
                speaker=Linaera
                message= _ "And that is well ended. I stand in your debt, Erlornas of Wesmere."
            [/message]
            [message]
                speaker=Erlornas
                #po: "a threeday’s march" isn't a real word, but is an archaic-sounding way to say "three days’ march
                message= _ "Indeed. But the greater threat remains; now I, too, sense the taint of this orc-gate, scarce a threeday’s march away. We must go swiftly, across the fields."
            [/message]
            [message]
                speaker=Linaera
                message= _ "I should advise against it, lord elf. Orcs have wholly taken these lands, swarming in great numbers over the plains and the hills. Traveling openly, you will surely find yourself hunted."
            [/message]
            [message]
                role=advisor
                message= _ "We have warred with orcs before, madame mage."
            [/message]
            [message]
                speaker=Erlornas
                #po: "skirmished" is in contrast to the previous line's "warred". A skirmish is much smaller in scale. Erlorans is saying they aren't prepared to fight huge bands of orcs.
                message= _ "We have <i>skirmished</i> with orcs. I should not be so quick to pit our merry little band against all the vastness of the north. What counsel do you tender, Linaera?"
            [/message]
            [message]
                speaker=Linaera
                message= _ "Near to us is a swamp, which extends some distance towards our goal. Evil things have made a nest there; foul creatures born of the lich. But orcs stay out of it, and there are firm paths on which to tread."
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Very well. Support from Wesmere follows close in my wake, but we cannot wait. I entrust your tower-keeper with my seal, and with directions for my kin. We make for the swamp."
            [/message]
            [endlevel]
                result=victory
                bonus=yes
                {NEW_GOLD_CARRYOVER 40}
            [/endlevel]
        [/event]
    [/event]

    #############################
    # TIME OVER
    #############################
    [event]
        name=side 1 turn {TURN_LIMIT} end
        # the original didn't have any dialogue here, so might as well leave it blank to avoid translations work. The turn limit is fairly generous anyway.
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]

#undef TURN_LIMIT
