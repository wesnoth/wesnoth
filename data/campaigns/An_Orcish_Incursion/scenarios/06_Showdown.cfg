#textdomain wesnoth-aoi

# Warning: If you are not a native and literate English speaker, do
# not try to modify the storyline text. It is deliberately written
# in a somewhat archaic and poetic form of English, and some previous
# attempts to "fix" it inflicted damage that was difficult to undo.

#
# This map tries to encourage the player to leave their castle and fight,
# instead of hiding in a corner waiting for Rangers to get in position
# To do that, we put large numbers of villages west/northwest of the player,
# and we fill the corners with poor or impassable terrain.
# We also assign some Wolf Riders to the assassin MAI to pressure Erlornas
#
# The forest path from the Rangers' spawn to Rualsha is also filled with cave and sand,
# increasing the number of turns the player must survive for.
# It takes approximately 13 turns for your Rangers to make their first attack on Rualsha
#
# Forest adjacent to Rualsha, village on 21,5, and the lava around Rualsha are important.
# The adjacent forest gives Rangers a good place to attack from,
# the lava makes it hard for reinforcements to reach him quickly,
# and the 21,5 village is a great place to put a ranger and block reinforcements for several turns (or to teleport in Linaera)
#
# The fungus/sand/cave around 28,12 is also helpful for preventing the 29,9 Direwolf Rider
# from running too far south. He's supposed to guard the forest, not get distracted fighting Erlornas
#

[scenario]
    id=06_Showdown
    name= _ "Showdown"
    map_file=06_Showdown.map
    turns=-1
    # I change this, make sure the assassins micro_ai still activates at a sensible time
    {DEFAULT_SCHEDULE_AFTERNOON}

    {SCENARIO_MUSIC       northerners.ogg}
    {EXTRA_SCENARIO_MUSIC frantic.ogg}
    {EXTRA_SCENARIO_MUSIC legends_of_the_north.ogg}

    [story]
        [part]
            music=wanderer.ogg
            {AOI_BIGMAP}
            story= _ "Marching hard through the night, the sorely wearied elves emerged from the swamp onto an arid plain. They gazed in dismay at the wasteland, strewn with refuse, boot-prints, and the broken stumps of slaughtered trees. What plants still clung to the meagre soil were blasted by cold, sandy winds."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "Ahead, the very air hung heavy with enchantment. It grew hard to draw breath. Rumbles and tremors in the earth bore witness to the power the Lich-Lord had unleashed."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "The scouts soon spotted orcs ahead, only to find the creatures engaged in an unexpected work."
        [/part]
    [/story]
    {AOI_TRACK {JOURNEY_06_NEW}}

    ###########################################################################
    #                                  DEFINE SIDES
    ###########################################################################
    # Lomarfel's war-chest serves as our initial gold
    {PLAYER_SIDE GOLD=0}
    {STARTING_VILLAGES_AREA 1 34 28 0}

    #############################
    # ORCS
    #############################
#define ORC_SIDE SIDE COLOR TYPE TRAITS FACE GOLD RECRUIT RETREAT_TARGET
    [side]
        side={SIDE}
        color={COLOR}
        controller=ai
        recruit={RECRUIT}
        # middling gold and income, but reinforced by orcs spawning from the gate
        gold={GOLD}
        income={ON_DIFFICULTY4 -2 0 2 4} # very many villages, even after the player takes a few. And lots of "income" from gateway orcs
        team_name=orcs
        user_team_name= _ "Orcs"
        {FLAG_VARIANT6 ragged}

        type={TYPE}
        {MODIFICATIONS({TRAITS})}
        facing={FACE}

        {REGROUP_MAI_DEFAULTS (retreat_tod=daytime {RETREAT_TARGET})}
    [/side]
#enddef
    {ORC_SIDE 2 orange ({ON_DIFFICULTY4 "Orcish Warrior"     "Orcish Warlord" "Orcish Warlord" "Orcish Warlord"}) ({TRAIT_INTELLIGENT}{TRAIT_RESILIENT}) se ({ON_DIFFICULTY4 50 100 150 200}) ({ON_DIFFICULTY4
    "Orcish Grunt"
    "Orcish Grunt"
    "Orcish Warrior"
    "Orcish Warrior"
    }) (
        [filter_retreat_target]
            # prioritize defending Rualsha personally, even if that means exposing our regular leaders
            id=Rualsha
        [/filter_retreat_target]
    )}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Orcish Archer"      {ON_DIFFICULTY4 1 0 0 0}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Orcish Crossbowman" {ON_DIFFICULTY4 0 1 1 2}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 "Orcish Slayer"      {ON_DIFFICULTY4 1 1 2 2}}
    {STARTING_VILLAGES 2 12}
    {STARTING_VILLAGES_AREA 2 12 16 3}
    {STARTING_VILLAGES_AREA 2 20-21 20 5}

    {ORC_SIDE 3 gold   ({ON_DIFFICULTY4 "Orcish Crossbowman" "Orcish Slurbow" "Orcish Slurbow" "Orcish Slurbow"}) ({TRAIT_RESILIENT}{TRAIT_STRONG})      se ({ON_DIFFICULTY4 25 50 75 100}) ({ON_DIFFICULTY4
    "Orcish Archer"
    "Orcish Archer"
    "Orcish Crossbowman"
    "Orcish Crossbowman"
    }) ()}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Orcish Grunt"   {ON_DIFFICULTY4 1 0 0 0}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Orcish Warrior" {ON_DIFFICULTY4 0 1 1 2}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Orcish Slayer"  {ON_DIFFICULTY4 1 1 2 2}}
    {STARTING_VILLAGES_AREA 3  4 20 5}
    {STARTING_VILLAGES_AREA 3 13 27 3}

    {ORC_SIDE 4 purple ({ON_DIFFICULTY4 "Goblin Knight"      "Direwolf Rider" "Direwolf Rider" "Direwolf Rider"}) ({TRAIT_STRONG}{TRAIT_RESILIENT})      sw ({ON_DIFFICULTY4 25 50 75 100})  ({ON_DIFFICULTY4
    "Goblin Spearman,Wolf Rider"
    "Goblin Spearman,Goblin Knight,Wolf Rider"
    "Goblin Spearman,Goblin Knight,Goblin Pillager"
    "Goblin Spearman,Goblin Knight,Goblin Pillager"
    }) ()}
    {LIMIT_RECRUITS 4 "Goblin Spearman" 4} # not CONTEMPORANEOUS, because once we're done with spearmen we want to devote all our income to assassin MAI wolf riders
    {STARTING_VILLAGES 4 6}

    # to encourage the player to defend multiple fronts,
    # and to discourage sending Erlornas to hide in the corner all by himself (since he's your only essential unit),
    # have side 4's recruits try to flank around and assassinate Erlornas
    # but wait a few turns before we create this MAI so we don't impede the stealthy rangers
    # turn 8 is also just after day, so our wolf riders have retreated and are about to attack again - a good time for them to change their strategy
    [event]
        name=recruit
        first_time_only=no
        [filter]
            side=4
            type_adv_tree=Wolf Rider
        [/filter]
        {MODIFY_UNIT id=$unit.id role assassin_side4}
    [/event]
    [event]
        name=turn 8
        [micro_ai]
            side=4
            ai_type=assassin
            action=add
            [filter]
                # so we don't affect leaders or guardian units
                role=assassin_side4
            [/filter]
            [filter_second]
                id=Erlornas
            [/filter_second]
            [prefer]
                # prefer circling around the east corner of the map
                x,y=33-99,20-99
            [/prefer]
        [/micro_ai]
    [/event]

    # dummy side for the initial cutscene orcs, and Selmar's gateway
    [side]
        side=5
        color=white
        team_name=orcs # or else the zone_guardians will trigger on the gateway
        hidden=yes
        no_leader=yes
    [/side]

    ###########################################################################
    #                                  PREPARE MAP
    ###########################################################################
    [event]
        name=prestart
        {ADD_MULTIHEX_WIND x,y=1-26,1-30 ""} # not the whole map; avoid the eastern forest/swamp

        #############################
        # SCENERY
        #############################
        {PLACE_IMAGE           "units/orcs/grunt-ne-die-8.png~RC(magenta>{RUALSHA_COLOR})" 15 20}
        {PLACE_IMAGE           "units/orcs/grunt-die-8.png~RC(magenta>{RUALSHA_COLOR})"     8 25}
        {PLACE_IMAGE           "units/orcs/grunt-ne-die-8.png~RC(magenta>{SELMAR_COLOR})"   9 25}
        {PLACE_IMAGE           "units/orcs/grunt-die-8.png~RC(magenta>{SELMAR_COLOR})"     11 26}
        {PLACE_IMAGE           "units/orcs/assassin-die-10.png~RC(magenta>{SELMAR_COLOR})" 20 13}
        {PLACE_IMAGE           "units/orcs/grunt-die-8.png~RC(magenta>{SELMAR_COLOR})"     14  3}
        {PLACE_IMAGE           "units/orcs/assassin-die-10.png~RC(magenta>{SELMAR_COLOR})" 15  3}
        {PLACE_IMAGE           "units/orcs/grunt-die-8.png~RC(magenta>{RUALSHA_COLOR})"    10 17}
        {PLACE_IMAGE           "items/bones.png"                                           14 19}
        {PLACE_IMAGE           "items/bones.png"                                           28  6}
        {PLACE_IMAGE           "items/bones.png"                                            2 10}

        #############################
        # GATEWAY AND EFFECTS
        #############################
        {GENERIC_UNIT 5 Gateway 17 8}
        [event]
            name=new turn
            first_time_only=no
            {MODIFY_UNIT type=Gateway resting no}
        [/event]
#define PLACE_LIGHTNING RADIUS MIN_DISTANCE
    [random_placement]
        [filter_location]
            {AND x,y,radius=17,8,{RADIUS}}
            {NOT x,y,radius=17,8,1}
        [/filter_location]
        min_distance={MIN_DISTANCE}
        num_items=999
        allow_less=yes
        variable=hex
        [command]
            # lightning storm lasts for 5 seconds, and repeats every 30 seconds
            {VARIABLE delay_before 30000}
            {VARIABLE_OP delay_after rand "0..5000"}
            {VARIABLE_OP delay_before sub $delay_after}
            {VARIABLE_OP scale   rand "107..214"}
            {VARIABLE_OP opacity rand "2..9"}
            {VARIABLE_OP flip    rand ",~FL()"}
            [item]
                name=lightning
                x,y=$hex.x,$hex.y
                halo=misc/blank-hex.png:$delay_before,halo/lightning/00[01~13].png~SCALE_INTO(999,$scale)~O(0.$opacity)$flip:75,misc/blank-hex.png:$delay_after
            [/item]
            {CLEAR_VARIABLE delay,variant}
        [/command]
    [/random_placement]
#enddef
        # more lightning close to the center, less lightning further out
        {PLACE_LIGHTNING 3  1}
        {PLACE_LIGHTNING 5  1}
        {PLACE_LIGHTNING 12 2}

        #############################
        # RUALSHA AND CUTSCENE ORCS
        #############################
        [unit]
            id=Rualsha
            name=_"Rualsha"
            type=Orcish Sovereign
            [modifications]
                # poor traits for combat lets Rangers kill him more reliably
                {TRAIT_QUICK}
                {TRAIT_INTELLIGENT}
                [object]
                    {EFFECT movement set=0}
                [/object]
            [/modifications]
            side=2
            x,y=17,6
            facing=se
            canrecruit=yes
        [/unit]
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Orcish Warrior"     "Orcish Warlord"  "Orcish Warlord"  "Orcish Warlord" } 20 4 ({FACING sw}{HITPOINTS 41}{ROLE leader5})}
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Orcish Archer"      "Orcish Archer"   "Orcish Archer"   "Orcish Archer"  } 21 5 ({FACING sw}{HITPOINTS 30}{ROLE helper5})}
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Orcish Grunt"       "Orcish Warrior"  "Orcish Warrior"  "Orcish Warrior" } 22 3 ({FACING sw}{HITPOINTS 36})}
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Goblin Spearman"    "Orcish Archer"   "Orcish Archer"   "Orcish Archer"  } 23 4 ({FACING sw}{HITPOINTS 11})}
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Goblin Spearman"    "Goblin Spearman" "Orcish Grunt"    "Orcish Grunt"   } 23 3 ({FACING sw}{HITPOINTS  5})}
        {GENERIC_UNITC 5 {ON_DIFFICULTY4 "Goblin Spearman"    "Goblin Spearman" "Goblin Spearman" "Goblin Spearman"} 24 3 ({FACING sw}{HITPOINTS 16})}
        {MODIFY_UNIT role=leader5 canrecruit yes} # modify after creation so he keeps his random traits
        [capture_village]
            side=5
            {FILTER side=5}
        [/capture_village]

        #############################
        # ORCISH GUARDS
        #############################
        # no variation with difficulty
        # 1) these units aren't meant to be fought unless you're ignoring Erlornas's plan and making a frontal assault instead
        # 2) Easy/Normal players felt it wasn't fitting for an important location like the gate to be only lightly guarded
        {LOYAL_UNITC 2 "Troll Warrior"    16 10 ({FACING sw} {ADD_MODIFICATION({TRAIT_FEARLESS} )} {ROLE mai_guard})}
        {LOYAL_UNITC 2 "Troll Warrior"    18 10 ({FACING se} {ADD_MODIFICATION({TRAIT_FEARLESS} )} {ROLE mai_guard})}
        {LOYAL_UNITC 2 "Troll Rocklobber" 14  9 ({FACING sw} {ADD_MODIFICATION({TRAIT_FEARLESS} )} {ROLE mai_guard})}
        {LOYAL_UNITC 2 "Troll Rocklobber" 20  9 ({FACING se} {ADD_MODIFICATION({TRAIT_FEARLESS} )} {ROLE mai_guard})}
        {LOYAL_UNITC 2 "Orcish Slurbow"   11 10 ({FACING se} {ADD_MODIFICATION({TRAIT_RESILIENT})} {ROLE mai_guard})}
        {LOYAL_UNITC 2 "Orcish Slurbow"   22 10 ({FACING sw} {ADD_MODIFICATION({TRAIT_RESILIENT})} {ROLE mai_guard})}

        # these guys help provide immediate threat if the player leaves their sneaking rangers unhidden
        # the AI isn't smart enough to search for your rangers, even after engaging them once
        # but poison only needs to hit once to neutralize a ranger, since they can't heal while remaining stealthy
        # the quick trait helps them guard a larger area
        {NOTRAIT_UNITC 4 {ON_DIFFICULTY4 "none"            "none"            "Orcish Assassin" "Orcish Assassin"} 34 11 ( {FACING se}{GUARDIAN}{ADD_MODIFICATION({TRAIT_QUICK}{TRAIT_INTELLIGENT})} )}
        {NOTRAIT_UNITC 4 {ON_DIFFICULTY4 "none"            "none"            "Orcish Assassin" "Orcish Assassin"} 31  8 ( {FACING sw}{GUARDIAN}{ADD_MODIFICATION({TRAIT_RESILIENT}{TRAIT_QUICK}  )} )}
        {NOTRAIT_UNITC 4 {ON_DIFFICULTY4 "Orcish Assassin" "Direwolf Rider"  "Direwolf Rider"  "Direwolf Rider" } 29  9 ( {FACING se}{GUARDIAN}{ADD_MODIFICATION({TRAIT_QUICK}{TRAIT_STRONG}     )} )}

        # not quick, so he won't fight for the village on 21 24
        {NOTRAIT_UNITC 2 {ON_DIFFICULTY4 "none" "Orcish Grunt"    "Orcish Grunt"       "Orcish Warrior"    } 21 18 ({FACING se}{ROLE mai_guard}{ADD_MODIFICATION({TRAIT_STRONG}{TRAIT_INTELLIGENT})})}
        {GENERIC_UNITC 2 {ON_DIFFICULTY4 "none" "Goblin Spearman" "Goblin Spearman"    "Goblin Spearman"   } 12 16 ({FACING sw}{ROLE mai_guard})}
        {GENERIC_UNITC 3 {ON_DIFFICULTY4 "none" "Goblin Spearman" "Goblin Spearman"    "Orcish Archer"     } 12 27 ({FACING se}{ROLE mai_guard})}
        {GENERIC_UNITC 3 {ON_DIFFICULTY4 "none" "Goblin Spearman" "Goblin Spearman"    "Goblin Spearman"   } 11 28 ({FACING sw}{ROLE mai_guard})}
        {GENERIC_UNITC 3 {ON_DIFFICULTY4 "none" "Orcish Archer"   "Orcish Crossbowman" "Orcish Crossbowman"}  2 17 ({FACING se}{ROLE mai_guard})}

        {RECALL_XY Linaera 27 29}
        {GUARANTEE_ADVISOR}
        {TELEPORT_UNIT role=advisor 29 28}
        {MODIFY_UNIT side=1 facing nw}
        {SCROLL_TO 21 6}
    [/event]

    ###########################################################################
    #                              PLAY SCENARIO
    ###########################################################################
    [event]
        name=start
        #############################
        # REBELS JOIN RUALSHA
        #############################
        {DELAY 1000}
        [message]
            speaker=Rualsha
            message= _ "—you dared resist Rualsha! You were led astray by the lich! But now you are beaten, and in defeat you see the truth. Do you swear fealty to me, and only me?"
        [/message]
        [message]
            role=leader5
            message= _ "Yes, High Orc!"
        [/message]
        [message]
            role=helper5
            message= _ "Yes, King Rualsha!"
        [/message]
        [message]
            speaker=Rualsha
            #po: WoF mentions that Lich-Lord Selmar is interested in summoning giants from the Old Continent. Giants aren't a faction in Wesnoth and probably never will be, but this is a nod to that.
            #po: These orcs just came from the Old Continent, so if there are giants there, these orcs would know about them.
            message= _ "Never again will orc bow to man, nor giant, nor lord of bones. Orc will only bow to orc! And who is the greatest orc of all?"
        [/message]
        [message]
            role=helper5
            message= _ "You are, King Rualsha!"
        [/message]
        {MODIFY_UNIT( side=5 {NOT type=Gateway} ) side 2}
        {TRANSFER_VILLAGE_OWNERSHIP 5 2}
        [message]
            role=leader5
            message= _ "My warriors obey only you!"
        [/message]
        {DELAY 500}

        #############################
        # ERLORNAS SPEAKS
        #############################
        [message]
            speaker=Erlornas
            message= _ "So you are Rualsha. At last we meet."
        [/message]
        [message]
            speaker=Rualsha
            message= _ "Raaahhh! Who dares interrupt me? Pointy ears... dainty wrists... snooty nose... you must be elves."
        [/message]
        [message]
            speaker=Erlornas
            #po: Rualsha is the "Orcish Sovereign" unit. This is a nod to that, but not crucial to keep in the translation.
            message= _ "Indeed. We elves have heard your name many times, sovereign. Yet I was unsure if I would find you here."
        [/message]
        [message]
            speaker=Rualsha
            message= _ "Ha! Am I not the gate-king you thought to meet? That wretched lich is dead, felled weeks ago by my hand. He brought me here to do his bidding, but in the end it was <b><i>me</i></b> who bested <b><i>him</i></b>."
        [/message]
        [message]
            speaker=Rualsha
            #po: the Orcish Sovereign's portrait includes a necklace of bones
            message= _ "Now his portal is mine; his bones my trophy! The last of his followers have sworn fealty to me, or else fallen under my blade!"
        [/message]
        [message]
            speaker=Linaera
            scroll=no
            message={ASIDE _"Rualsha wears some of the lich’s bones around his neck. I must have them to dispel the gate."}
        [/message]
        [message]
            speaker=Rualsha
            message= _ "If you think to stop me, elf, you come too late. Thousands, hundreds of thousands of orcs have already spread across the north."
        [/message]
        [message]
            speaker=Rualsha
            #po: "your jewel" refers to the Ruby of Fire, which we know the orcs tried to take in LoW. But this campaign isn't about the ruby, so it's only an oblique reference.
            message= _ "The lich was weak; he dared command only a few of those who came, for fear of revolt. But I am strong, and I am orc; the hordes will gladly flock to my banner. Your jewel will be mine, your forests reduced to firewood, and your people left begging for a merciful death!"
        [/message]
        {DELAY 500}

        #############################
        # REINFORCEMENTS ARRIVE
        #############################
        {SOUND horse-canter.wav}
        [unit]
            side=1
            type=Elvish Rider
            id=Lomarfel
            name= _ "Lomarfel"
            profile=portraits/lomarfel.png
            x,y=33,30
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESILIENT}
            [/modifications]
            facing=nw
            animate=yes
        [/unit]
        {DELAY 500}
        [message]
            speaker=Lomarfel
            message= _ "My lord! What is this terrible place? We have ridden hard for over a week to catch up with you."
        [/message]
        {MOVE_UNIT id=Lomarfel 31 29}
#define LOYAL_RANGER X Y TYPE GENDER SECOND_TRAIT
    [unit]
        type={TYPE}
        x,y={X},{Y}
        side=1
        [modifications]
            {TRAIT_LOYAL}
            {SECOND_TRAIT}
        [/modifications]
        facing=nw
        gender={GENDER}
        animate=yes
    [/unit]
#enddef
        # no quick trait; let these guys take a little longer to reach Rualsha.
        # the player might have his own quick rangers, of course
        {LOYAL_RANGER 33 30 "Elvish Ranger"  female {TRAIT_DEXTROUS}}
        {LOYAL_RANGER 34 30 "Elvish Avenger" female {TRAIT_DEXTROUS}}
        {LOYAL_RANGER 34 29 "Elvish Ranger"    male {TRAIT_STRONG}}
        {LOYAL_RANGER 35 30 "Elvish Ranger"  female {TRAIT_RESILIENT}}

        #############################
        # PLANNING THE SNEAK ATTACK
        #############################
        [message]
            speaker=Lomarfel
            message= _ "I bring a weighty war-chest and the reinforcements you requested from the Ka’lian, Lord Erlornas. The council has deliberated, and sets in your hands full authority over this matter of the orcs."
        [/message]
        # the lower the player's current gold, the more gold we give them in the war-chest (rounded to the nearest 5)
        # this provides a minor comeback mechanism
        [store_gold]
            side=1
        [/store_gold]
        {VARIABLE amount "$( round(round( max([75, 150 - $gold*0.5]) /5.0)*5) )"}
        [message]
            speaker=narrator
            image=wesnoth-icon.png
            #po: $amount will be between 150 and 75
            message=_"You have gained $amount gold!"
        [/message]
        {SOUND gold.ogg}
        [gold]
            side=1
            amount=$amount
        [/gold]
        {CLEAR_VARIABLE amount}
        [message]
            speaker=Erlornas
            message= _ "Fortunate is your hour of arrival, Lomarfel. I fear Rualsha’s host is too great for us to vanquish in open battle, even with your aid. But the Rangers who have come with you are skilled in stealth."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Even in the blasted ruins of this place, they can still pass veiled from orcish gaze, and fall upon Rualsha from behind. Once the finishing blow is struck, we will seal his portal and bring this matter to an end."
        [/message]

        #############################
        # OBJECTIVES
        #############################
        [objectives]
            [objective]
                description= _ "Defeat Rualsha"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Erlornas or Linaera"
                condition=lose
            [/objective]
            {IS_LAST_SCENARIO}
            [note]
                description=_"Your enemy is well-defended against attacks from the south. Use rangers to sneak through the eastern forest and mount a surprise attack from the north."
            [/note]
        [/objectives]
    [/event]

    #############################
    # GATE TELEPORT ANIMATION
    #############################
#define ADD_TELEPORT_ANIM FLT
    [modify_unit]
        [filter]
            {FLT}
        [/filter]
        [object]
            duration=turn
            [effect]
                apply_to=new_animation
                id=dark_teleport_anims
                [animation]
                    apply_to=dark_teleport_out
                    start_time=-900
                    teleport_ring_start_time=-900
                    teleport_fill_start_time=-610
                    [teleport_ring_frame]
                        duration=900
                        image=halo/dark-teleportA.png
                        alpha=0~1:290,1:320,1~0:290
                    [/teleport_ring_frame]
                    [teleport_fill_frame]
                        duration=320
                        image=halo/dark-teleportB.png
                        alpha=0~1:150,1:20,1~0:150
                    [/teleport_fill_frame]
                    [frame]
                        # default frame
                        duration=450
                    [/frame]
                    [frame]
                        image=misc/blank-hex.png
                        duration=450
                    [/frame]
                [/animation]
                [animation]
                    apply_to=dark_teleport_in
                    start_time=-900
                    teleport_ring_start_time=-900
                    teleport_fill_start_time=-610
                    [teleport_ring_frame]
                        duration=900
                        image=halo/dark-teleportA.png
                        alpha=0~1:290,1:320,1~0:290
                    [/teleport_ring_frame]
                    [teleport_fill_frame]
                        duration=320
                        image=halo/dark-teleportB.png
                        alpha=0~1:150,1:20,1~0:150
                    [/teleport_fill_frame]
                    [frame]
                        image=misc/blank-hex.png
                        duration=450
                    [/frame]
                    [frame]
                        # default frame
                        duration=450
                    [/frame]
                [/animation]
            [/effect]
        [/object]
    [/modify_unit]
#enddef

    #############################
    # GATE SPAWNS UNITS EACH TURN
    #############################
    [event]
        name=new turn
        first_time_only=no
        [filter_condition]
            {OR({VARIABLE_CONDITIONAL turn_number equals  2})}
            {OR({VARIABLE_CONDITIONAL turn_number equals  5})}
            {OR({VARIABLE_CONDITIONAL turn_number equals  8})}
            {OR({VARIABLE_CONDITIONAL turn_number equals 10})}
            {OR({VARIABLE_CONDITIONAL turn_number equals 12})}
            {OR({VARIABLE_CONDITIONAL turn_number equals 14})}
            {LUA(<< return (wesnoth.current.turn>=15) >>)}
        [/filter_condition]
        [random_placement]
            variable=loc
            # there's only 3 hexes on which to spawn units
            # if those hexes are already blocked, we'll still spawn on a different hex,
            # but it's prettier if we spawn on these particular 3 hexes, so don't spawn more than 3 units
            num_items=3
            min_distance=0
            allow_less=yes
            [filter_location]
                x=16,17,18
                y= 9,10, 9
                # don't exclude hexes with units. If our placed hex is already filled by a unit, our unit just gets pushed to another hex - that's fine.
            [/filter_location]
            [command]
                # lots of fast units, so it's harder for the player to run and hide rather than stand and fight
                {VARIABLE_OP type rand ({ON_DIFFICULTY4
                "Goblin Spearman, Goblin Spearman,    Goblin Spearman,   Goblin Spearman, Orcish Archer,  Orcish Assassin"
                "Orcish Warrior,  Orcish Archer,      Orcish Assassin,   Goblin Knight,   Wolf Rider,     Wolf Rider     "
                "Orcish Warrior,  Orcish Crossbowman, Orcish Slayer,     Goblin Knight,   Goblin Knight,  Goblin Pillager"
                "Orcish Warlord,  Orcish Crossbowman, Orcish Nightblade, Direwolf Rider,  Direwolf Rider, Goblin Pillager"
                })}
                # don't give any units to side 4, to avoid the upkeep burden.
                # let side 4 keep all its income to recruit Wolf Riders, which it'll then use to try and assassinate Erlornas
                {VARIABLE_OP side rand 2,2,3}
                # always make gate units quick, so it's harder for the player to run and hide rather than stand and fight
                {GENERIC_UNIT $side $type $loc.x $loc.y} {ADD_MODIFICATION({TRAIT_QUICK})} {PASSABLE} {ROLE just_spawned}
                [hide_unit]
                    role=just_spawned
                [/hide_unit]

                [store_unit]
                    {FILTER role=just_spawned}
                    variable=orc
                [/store_unit]
                {SOUND wail-sml.wav}
                {FAKE_UNIT_MOVE 17 $orc.x 8 $orc.y 2 Ghost ()}

                {ADD_TELEPORT_ANIM role=just_spawned}
                [unhide_unit]
                    role=just_spawned
                [/unhide_unit]
                {ANIMATE_UNIT role=just_spawned dark_teleport_in}

                {MODIFY_UNIT role=just_spawned role ""}
                {CLEAR_VARIABLE type,side,orc}
            [/command]
        [/random_placement]
    [/event]

    #############################
    # SYLPH/SHYDE FLIES TO GATE
    #############################
    [event]
        name=prestart
        # the first time, never kill the unit - give the player a chance to learn it's dangerous
        # if the player sends a unit into the gateway a second time, they should already know what to expect
        {VARIABLE kill_gate_flier no}
    [/event]
    [event]
        name=enter hex
        first_time_only=no
        [filter]
            {FILTER_ADJACENT type=Gateway}
        [/filter]

        [cancel_action][/cancel_action]
        {FIRE_EVENT_UNIT explain_gateway_flier id=$unit.id}
        {SOUND magic-dark-big.ogg}
        {DELAY 500}
        {RANDOM "33..41"}
        [harm_unit]
            {FILTER id=$unit.id}
            amount=$random
            kill=$kill_gate_flier
            animate=yes
        [/harm_unit]
        {VARIABLE kill_gate_flier yes}

        # store the tresspasser, fill gate-adjacent hexes with units, then unstore the tresspasser so that it gets pushed away from the gate
        # we can't just teleport to x2,y2, because it might be occupied (in which case we might get pushed back next to the gate)
        [if]
            [have_unit]
                id=$unit.id
            [/have_unit]
            [then]
                {ADD_TELEPORT_ANIM id=$unit.id}
                {ANIMATE_UNIT id=$unit.id dark_teleport_out}
                [store_unit]
                    {FILTER id=$unit.id}
                    kill=yes
                    variable=stored_trespasser
                [/store_unit]
                {GENERIC_UNIT 2 Peasant 16 7}
                {GENERIC_UNIT 2 Peasant 17 7}
                {GENERIC_UNIT 2 Peasant 18 7}
                {GENERIC_UNIT 2 Peasant 16 8}
                {GENERIC_UNIT 2 Peasant 17 9}
                {GENERIC_UNIT 2 Peasant 18 8}
                [unstore_unit]
                    variable=stored_trespasser
                    find_vacant=yes
                    x,y=$x2,$y2
                [/unstore_unit]
                {CLEAR_VARIABLE stored_trespasser}
                {KILL type=Peasant}
                {ANIMATE_UNIT id=$unit.id dark_teleport_in}
            [/then]
        [/if]
    [/event]
    [event]
        name=explain_gateway_flier
        [message]
            speaker=unit
            message= _ "Aarrggh!"
        [/message]
        [message]
            speaker=Rualsha
            #po: A Sylph or a Shyde has just tried to fly through a magical portal, but units can only exit from the portal, not enter it. The Sylph/Shyde took damage and was expelled from the portal. "flutter-rat" is a derogatory reference to their wings.
            message= _ "One way only, flutter-rat."
        [/message]
    [/event]

    ###########################################################################
    #                              VICTORY / DEFEAT
    ###########################################################################
    #############################
    # ATTACK RUALSHA
    #############################
    [event]
        name=unit hits,unit misses
        {FILTER_SECOND id=Rualsha}
        [if]
            [have_unit]
                side=1
                {NOT type="Elvish Ranger,Elvish Avenger,Silver Mage"}
                [filter_location]
                    {FILTER id=Rualsha}
                    radius=3
                [/filter_location]
            [/have_unit]
            [then]
                [message]
                    speaker=Rualsha
                    #po: Rualsha has just been attacked by an army of elves
                    message= _ "I will have your heads!"
                [/message]
            [/then]
            [else]
                [message]
                    speaker=Rualsha
                    #po: Rualsha has just been ambushed by elves hiding in forest
                    message= _ "Treachery! I will have your heads!"
                [/message]
            [/else]
        [/if]
    [/event]

    #############################
    # NORTH TROLL LEADER DIES
    #############################
    [event]
        name=last breath
        {FILTER id=Rualsha}
        [if]
            [not]
                [have_unit]
                    side=2,3,4
                    canrecruit=yes
                [/have_unit]
            [/not]
            [then]
                {ACHIEVE s06}
            [/then]
        [/if]
        [message]
            speaker=unit
            message= _ "You may slay me, Erlornas, but my people live on. They will not forget! They will pursue you, and destroy you utterly... we will... we... arrgh..."
        [/message]
        [event]
            name=die
            {FADE_MUSIC_OUT 500}
            {GUARANTEE_ADVISOR}

            #--------------------
            # LINAERA APPROACHES THE GATE
            #--------------------
            [message]
                speaker=Erlornas
                message= _ "Now is our chance, Linaera!"
            [/message]
            {KILL id=Rualsha}
            [store_locations]
                terrain=*^V*
                x,y=16-22,2-6
                {NOT({FILTER()})}
                variable=unoccupied_villages
            [/store_locations]
            {IF_VAR unoccupied_villages.length greater_than 0 (
                [then]
                    [teleport]
                        {FILTER id=Linaera}
                        x,y=$unoccupied_villages[0].x,$unoccupied_villages[0].y
                        animate=yes
                    [/teleport]
                    {MOVE_UNIT id=Linaera 17 6}
                [/then]
                [else]
                    [teleport]
                        {FILTER id=Linaera}
                        x,y=17,6
                        animate=yes
                    [/teleport]
                [/else]
            )}
            {DELAY 500}

            #--------------------
            # LINAERA LAMENTS
            #--------------------
            [message]
                speaker=Linaera
                message= _ "The gate... I am overwhelmed by its power! To think that even Selmar, weakest of the Lich-Lords, could sculpt a creation of this magnificence."
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Hurry! Destroy the foul thing before yet more orcs emerge!"
            [/message]
            [message]
                speaker=Linaera
                message= _ "So much Wesfolk knowledge has been lost, Erlornas. First in our flight from the Old Continent, then by our wars on the Green Isle and the deaths of our Lords. And now am I to destroy this, too: this final monument to the greatness of my once-proud people?"
            [/message]
            [message]
                speaker=Linaera
                message= _ "Alas. Such is the price of our survival."
            [/message]

            #--------------------
            # DESTROY THE GATE
            #--------------------
            [message]
                speaker=narrator
                image=misc/blank-hex.png
                message = "<i>" + _ "As the orc drew his last ragged breath, the Wesfolk mage spoke a word and cast forth her hand..." + "</i>"
            [/message]
            {REPEAT 4 (
                {SOUND magic-faeriefire.ogg}
                {ANIMATE_UNIT id=Linaera pre_teleport}
            )}
            {SOUND rumble.ogg}
            {QUAKE()}
            {DELAY 1500}
            {SOUND rumble.ogg}
            {QUAKE()} {QUAKE()} {QUAKE()} {QUAKE()} {QUAKE()}
            {SCREEN_FADER 255,255,255 255 250}
            {KILL type=Gateway}
            [remove_item]
                image=lightning
            [/remove_item]
            [terrain]
                {AND terrain=Qlf*^*}
                terrain=Ur^Qhu
            [/terrain]
            [redraw][/redraw]
            {SCREEN_FADER 255,255,255 0 250}
            {REPLACE_SCENARIO_MUSIC silence.ogg}
            {FADE_MUSIC_IN 100}

            #--------------------
            # EPILOGUE
            #--------------------
            {DELAY 1500}
            [message]
                speaker=Linaera
                message= _ "It is done."
            [/message]
            [message]
                role=advisor
                message= _ "We have won! The orcish warbands will scatter! In time the sands shall drink deeply of their blood."
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Perhaps. But I fear Rualsha spake truth. So many have already come through the gate. If hundreds of thousands of orcs have already spread across the north, how are we ever to be rid of them?"
            [/message]
            [message]
                speaker=Erlornas
                message= _ "Come, we must hasten from this place while the way is yet clear. We have won a first victory here, but I fear dark times will come upon its heels..."
            [/message]
            [endlevel]
                result=victory
                carryover_report=no
                linger_mode=no
            [/endlevel]
        [/event]
    [/event]
[/scenario]

#undef LOYAL_RANGER
#undef ADD_TELEPORT_ANIM
#undef TURN_LIMIT
