#textdomain wesnoth-aoi

# Warning: If you are not a native and literate English speaker, do
# not try to modify the storyline text. It is deliberately written
# in a somewhat archaic and poetic form of English, and some previous
# attempts to "fix" it inflicted damage that was difficult to undo.

#
# the troll keeps are deliberately hard to get to
# while a determined player might be able to clear the map,
# I think it'll be more interesting for the player to push straight
# towards the end while fending off flanking trolls
#

# time over dialogue says "four days". If we start at Second Watch,
# 26 turns works out to Dawn on the 5th day
#define TURN_LIMIT
26#enddef

[scenario]
    id=03_Valley_of_Trolls
    name= _ "Valley of Trolls"
    map_file=03_Valley_of_Trolls.map
    turns={TURN_LIMIT}
    next_scenario=04_Linaera_the_Quick
    {DEFAULT_SCHEDULE_SECOND_WATCH}

    {SCENARIO_MUSIC       underground.ogg}
    {EXTRA_SCENARIO_MUSIC knalgan_theme.ogg}
    {EXTRA_SCENARIO_MUSIC the_deep_path.ogg}

    [story]
        [part]
            music=breaking_the_chains.ogg
            {AOI_BIGMAP}
            story= _ "Next morning, the elves set off again, increasingly wearied by the hardships of the campaign and longing for the green comfort of their home forests. This land was barren and rugged; nothing shielded them from biting northern wind as they traveled towards the mountains looming before them."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "At dusk they arrived at the mouth of a valley cutting almost straight through the range and made camp, as scouts warned that the area was hostile and the road ahead treacherous in darkness. There were no songs or music that night and most of the elves slept uneasily. An unlucky few kept a cautious watch."
        [/part]
        [part]
            {AOI_BIGMAP}
            story= _ "When sunrise came, the elves moved into battle formations. Whatever waited in the slopes ahead, it would not find them unprepared."
        [/part]
    [/story]
    {AOI_TRACK {JOURNEY_03_NEW}}

    ###########################################################################
    #                                  DEFINE SIDES
    ###########################################################################
    {PLAYER_SIDE SHROUD=yes}

    #############################
    # TROLLS
    #############################
#define TROLL_SIDE SIDE COLOR TYPE TRAITS GOLD INCOME FACE
    [side]
        side={SIDE}
        color={COLOR}
        controller=ai
        recruit=Troll Whelp
        # low gold, but decently high income
        # that way, the troll leaders you bypass will remain a thorn in the side
        gold={GOLD}
        income={INCOME}
        team_name=trolls
        user_team_name= _ "Trolls"
        {FLAG_VARIANT6 ragged}

        type={TYPE}
        {MODIFICATIONS({TRAITS})}
        facing={FACE}

        {REGROUP_MAI_DEFAULTS (
            retreat_tod=daytime
            [filter_retreat_target]
                side=4
                canrecruit=yes
            [/filter_retreat_target]
        )}
        [+ai]
            # prefer targeting Erlornas, since he's the player's objective
            {GOAL_UNIT 4 id=Erlornas}
        [/ai]
    [/side]
    {STARTING_VILLAGES {SIDE} 6}
#enddef
    {TROLL_SIDE 2 purple ({ON_DIFFICULTY4 "Troll Whelp" "Troll"         "Troll"         "Troll"        }) ({TRAIT_STRONG}  {TRAIT_RESILIENT}) ({ON_DIFFICULTY4 15 30 45  60}) ({ON_DIFFICULTY4 -2 0 2  4}) sw}
    {TROLL_SIDE 3 orange ({ON_DIFFICULTY4 "Troll Whelp" "Troll Shaman"  "Troll Shaman"  "Troll Shaman" }) ({TRAIT_RESILIENT}  {TRAIT_STRONG}) ({ON_DIFFICULTY4 15 30 45  60}) ({ON_DIFFICULTY4 -2 0 2  4}) ne}
    {TROLL_SIDE 4 brown  ({ON_DIFFICULTY4 "Troll"       "Troll"         "Troll Warrior" "Troll Warrior"}) ({TRAIT_FEARLESS}{TRAIT_RESILIENT}) ({ON_DIFFICULTY4 30 60 90 120}) ({ON_DIFFICULTY4 -2 2 6 10}) se}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 "Goblin Spearman"  {ON_DIFFICULTY4 4 0 0 0}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 "Troll"            {ON_DIFFICULTY4 0 0 1 1}}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 "Troll Rocklobber" {ON_DIFFICULTY4 0 1 1 2}}

    ###########################################################################
    #                                  PREPARE MAP
    ###########################################################################
#define S03_CAVES
    x=0-1,  2,    3,    4,    5,    6,    7,     46, 47, 48, 49, 50-99
    y=11-99,11-99,12-99,12-99,13-99,13-99,13-99, 0-2,0-3,0-3,0-4,0-4
#enddef
    [event]
        name=prestart
        [time_area]
            {S03_CAVES}
            {UNDERGROUND}
        [/time_area]
        {ADD_MULTIHEX_WIND (
            x,y=1-40,1-16
            {NOT {S03_CAVES}}
        ) "~FL()"}

        [remove_shroud]
            side=1
            terrain=*^V*,*^F*,Uue*^*,!,Uu^*,Uh^*,Ur^*,Q*^*,K*^*,C*^*,M*^*,H*^*,X*^*,T*^*
            radius=1
            {OR x,y=17-20,10-12}
            {OR x,y=2,7}
            {OR x,y=15,2}
            {NOT x,y=44,5}
            {NOT x,y=3-4,13-14}
        [/remove_shroud]
        {GUARANTEE_ADVISOR}
        {MODIFY_UNIT side=1 facing nw}
    [/event]

    ###########################################################################
    #                              PLAY SCENARIO
    ###########################################################################
    [event]
        name=start
        [message]
            role=advisor
            message= _ "We are far from our lands, now, Erlornas, and we have driven the orcs from the forest. Why do we not return home?"
        [/message]
        [message]
            speaker=Erlornas
            message= _ "You know well enough... Rualsha. That name sounds everywhere we go since the incursion began. That orc is much more than a mere marauding bandit in search of pillage. And he wants this land. <i>Our</i> land. He is planning an invasion, I’m sure of it. We must gather more information about his plans before we go back."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "And tell me... How did you sleep last night?"
        [/message]
        [message]
            role=advisor
            message= _ "How did I?... Uneasy, lord. My dreams were bleak, some of them nightmares."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Yes. The earth currents are perturbed here, and the bridges to the dreamland are tainted. I think there is a mage dwelling somewhere nearby. Or perhaps more than one; the traces are mixed, and some of them have an unwholesome flavor."
        [/message]
        [message]
            role=advisor
            message= _ "It would be dire indeed for us, if these orcs have magic to add to their battle-might."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "We must discover if this is so."
        [/message]
        [message]
            role=advisor
            message= _ "Information will do us no good if we are killed before we return with it! These mountains look like troll territory."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Enough. The sun’s fully over the horizon. Give the order to advance."
        [/message]
        {PLACE_IMAGE items/gohere.png 1 1-5}

        #############################
        # OBJECTIVES
        #############################
        [objectives]
            [objective]
                description= _ "Move Erlornas to the west edge of the map"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Erlornas"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
#ifdef EASY
            [note]
                description=_"Trolls are poor fighters when not on rugged terrain and fare even worse during the daytime. Lure them out of the hills and attack in the sunlight."
            [/note]
#endif
        [/objectives]
    [/event]

    #############################
    # NORTH TROLL LEADER DIES
    #############################
    [event]
        name=last breath
        [filter]
            side=4
            canrecruit=yes
        [/filter]
        [message]
            speaker=unit
            message= _ "Dis not over! Rualsha gonna make you pay!"
        [/message]
        [message]
            role=advisor
            message= _ "The chieftain blocking the pass is slain, lord. The way forward is clear."
        [/message]
        [show_objectives]
        [/show_objectives]
    [/event]

    #############################
    # ACHIEVEMENT
    #############################
    [event]
        name=die
        [filter_condition]
            [not]
                [have_unit]
                    side=2,3,4
                    canrecruit=yes
                [/have_unit]
            [/not]
        [/filter_condition]
        {ACHIEVE s03}
    [/event]

    ###########################################################################
    #                              VICTORY / DEFEAT
    ###########################################################################
    [event]
        name=moveto
        [filter]
            id=Erlornas
            x=1
        [/filter]
        [message]
            speaker=Erlornas
            message= _ "I have fought my way through. Break camp and move everyone through the pass before they rally. We’ll rest a bit on the other side; we have earned it."
        [/message]
        [message]
            role=advisor
            message= _ "At once. How much time do you think we have?"
        [/message]
        [message]
            speaker=Erlornas
            message= _ "A day, perhaps. We fought three clans today; they won’t take long to rally. We need to be gone from here by sunset next."
        [/message]
        [message]
            side=4 # this leader mentions Rualsha when he dies
            canrecruit=yes
            message= _ "Dis not over! Rualsha gonna make you pay!"
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    #############################
    # TIME OVER
    #############################
    [event]
        name=side 1 turn {TURN_LIMIT} end
        {GUARANTEE_ADVISOR}
        [message]
            role=advisor
            message= _ "We can’t get through, my lord. These whelps are not individually very dangerous, but there are huge numbers of them."
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Four days of combat and nothing to show for it. How does it feel to you?"
        [/message]
        [message]
            role=advisor
            message= _ "Terrible, my lord. Never in my life did I dream I’d be bested by mere trolls. What are your orders?"
        [/message]
        [message]
            speaker=Erlornas
            message= _ "Withdraw and make camp a safe distance from the hills. There is no further point in this fight. We’ll wait for reinforcements."
        [/message]
        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message= _ "The reinforcements arrived a few days later, a crack force of rangers with some cavalry support. When they attempted the pass again, they found not trolls but something worse — an orcish army approaching from the north."
        [/message]
        [message]
            speaker=narrator
            image=wesnoth-icon.png
            message= _ "The battle that ensued was bloody and inconclusive, and the elven losses were only the beginning of the mournful toll in a war that would rage for many years after."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
[/scenario]

#undef TROLL_SIDE
#undef S03_CAVES
#undef TURN_LIMIT
