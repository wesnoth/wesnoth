#textdomain wesnoth-aoi
[textdomain]
    name="wesnoth-aoi"
[/textdomain]

#ifdef CAMPAIGN_AN_ORCISH_INCURSION
{internal/Weather}
[lua]
    code = << wesnoth.dofile('lua/skip_animations.lua') >>
[/lua]
[binary_path]
    path=data/campaigns/An_Orcish_Incursion/
[/binary_path]
{campaigns/An_Orcish_Incursion/utils}
[units]
    {campaigns/An_Orcish_Incursion/units}
[/units]
{campaigns/An_Orcish_Incursion/scenarios}
#endif

# wmlscope: set export=no
[campaign]
    id=An_Orcish_Incursion
    icon="units/elves-wood/lord.png~TC(1,magenta)"
    image="data/campaigns/An_Orcish_Incursion/images/campaign_image.png"
    background="data/core/images/story/wesmere.webp"
    name= _ "An Orcish Incursion"
    abbrev= _ "AOI"
    rank=154 # just before LoW
    start_year="8 YW"
    end_year="9 YW"
    first_scenario=01_Defend_the_Forest
    define="CAMPAIGN_AN_ORCISH_INCURSION"

    {CAMPAIGN_DIFFICULTY EASY      "data/campaigns/Heir_To_The_Throne/images/units/elvish-civilian/elf+fem.png~RC(magenta>green)" _"Easy"   _"1x enemies"}
    {CAMPAIGN_DIFFICULTY NORMAL    "units/elves-wood/fighter/fighter.png~RC(magenta>green)"                                        _"Normal" _"2x enemies"} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD      "units/elves-wood/lord.png~RC(magenta>green)"                                                   _"Hard"   _"3x enemies"}
    {CAMPAIGN_DIFFICULTY NIGHTMARE "units/elves-wood/high-lord.png~RC(magenta>green)"                                              _"Deadly" _"4x enemies"}

    description=_ "Orcs once again trouble the Great Continent. Marshal the elves of Wesmere and lead them to victory during their first encounter against this alien new foe." + "

" + _"(Novice level, 6 scenarios.)"

    end_text_duration=5000
    end_text=_ "The saga continues in
<i>Legend of Wesmere</i>"

    [about]
        title = _ "Campaign Design"
        [entry]
            name = "Josh Parsons"
        [/entry]
    [/about]
    [about]
        title = _ "Adaptation for mainline"
        [entry]
            name = "Eric S. Raymond"
        [/entry]
    [/about]
    [about]
        title = _ "Post 1.4 story and gameplay improvements"
        [entry]
            name = "Piotr Cychowski (cycholka)"
        [/entry]
    [/about]
    [about]
        title = _ "Artwork and Graphics Design"
        [entry]
            name="Bhoren"
            comment = "story art"
        [/entry]
        [entry]
            name="Kathrin Polikeit (Kitty)"
            comment = "portraits"
        [/entry]
        [entry]
            name="inferno8"
            comment = "gate visual effects"
        [/entry]
    [/about]
    [about]
        title = _ "Editing, proofreading and gameplay testing"
        [entry]
            name = "Charlie Roselius (Jozrael)"
        [/entry]
        [entry]
            name = "Eric S. Raymond"
        [/entry]
        [entry]
            name = "vicza"
        [/entry]
    [/about]
    [about]
        title= _ "1.15.x Difficulty Adjustments"
        [entry]
            name="Eric Gallager (egallager)"
        [/entry]
    [/about]

    [load_resource]
        id=stronger_amlas
