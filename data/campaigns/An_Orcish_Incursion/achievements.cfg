#textdomain wesnoth-aoi

#define ACHIEVEMENT ICON ID NAME DESC
    [achievement]
        icon={ICON}
        id={ID}
        name={NAME}
        description={DESC}
    [/achievement]
#enddef

#define CORE
data/core/images#enddef
#define FRAMED IMAGE
#arg COLOR
red#endarg
{CORE}/attacks/blank-attack.png~SCALE(72,72)~BLIT({IMAGE}~RC(magenta>{COLOR}))#enddef

[achievement_group]
    display_name=_"An Orcish Incursion"
    content_for=an_orcish_incursion

    # western wesnoth
    {ACHIEVEMENT "{FRAMED {CORE}/terrain/forest/forested-deciduous-summer-hills-tile.png}" "aoi_s01"  _"Scenario 1: The Forest, Defended"                 _"Prevent the orcs from capturing more than one village in <i>Defend the Forest</i>."}
    {ACHIEVEMENT "{CORE}/attacks/pitchfork.png"                                            "aoi_s02"  _"Scenario 2: Two-Pronged"                          _"Defeat both enemy leaders on the same turn in <i>Wasteland</i>."}
    {ACHIEVEMENT "{FRAMED {CORE}/units/trolls/warrior-bob-s-4.png COLOR=brown}"            "aoi_s03"  _"Scenario 3: Trolled"                              _"Defeat all enemy leaders in <i>Valley of Trolls</i>."}
    #po: reference to the fairy tale "Rapunzel", which includes the line "Rapunzel, Rapunzel, let down your hair."
    {ACHIEVEMENT "{FRAMED {CORE}/terrain/castle/encampment/tall-keep-tile.png}"            "aoi_s04"  _"Scenario 4: Linaera, Linaera! Let Down Your Hair" _"End every turn with Linaera inside her tower in <i>Linaera the Quick</i>."}
    {ACHIEVEMENT "{CORE}/attacks/slingshot.png"                                            "aoi_s05"  _"Scenario 5: Luddite"                              _"Complete <i>A Detour through the Swamp</i> without recruiting/recalling Shamans or Mages."}
    {ACHIEVEMENT "{FRAMED {CORE}/units/orcs/warlord-victory5.png}"                         "aoi_s06"  _"Scenario 6: Contrarian"                           _"Defeat all enemy leaders in <i>Showdown</i>."}
[/achievement_group]

#undef ACHIEVEMENT
#undef CORE
#undef FRAMED
