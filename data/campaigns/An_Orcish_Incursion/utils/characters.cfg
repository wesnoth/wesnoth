#textdomain wesnoth-aoi

#define PLAYER_SIDE
#arg GOLD
100#endarg
#arg FOG
no#endarg
#arg SHROUD
no#endarg
    [side]
        side=1
        controller=human
        color=green

        {CHARACTER_STATS_ERLORNAS}
        defeat_condition=never
        gold={GOLD}

        team_name=elves
        user_team_name= _ "Elves"
        fog={FOG}
        shroud={SHROUD}
        {FLAG_VARIANT wood-elvish}
    [/side]
    [event]
        name=start
        [if]
            [have_unit]
                id=Linaera
            [/have_unit]
            [then]
                [modify_side]
                    side=1
                    recruit=Elvish Archer,Elvish Fighter,Elvish Scout,Elvish Shaman,Mage
                [/modify_side]
            [/then]
            [else]
                [modify_side]
                    side=1
                    recruit=Elvish Archer,Elvish Fighter,Elvish Scout,Elvish Shaman
                [/modify_side]
            [/else]
        [/if]
    [/event]
#enddef

#define CHARACTER_STATS_ERLORNAS
    type=Elvish Lord
    id=Erlornas
    name= _ "Erlornas"
    profile=portraits/erlornas.png
    unrenamable=yes
    [modifications]
        {TRAIT_RESILIENT}
        {TRAIT_DEXTROUS}
    [/modifications]
    canrecruit=yes
    extra_recruit=
#enddef

#define CHARACTER_STATS_LINAERA
    type=Silver Mage
    id=Linaera
    name= _ "Linaera"
    profile=portraits/linaera.png
    gender=female
    canrecruit=yes
    unrenamable=yes
    [modifications]
        {TRAIT_INTELLIGENT}
        {TRAIT_QUICK}
    [/modifications]
    extra_recruit=Mage
#enddef

#define __ADVISOR MORE_CRITERIA
    # ensure at least one unit has the "advisor" role
    # if it's not already on the map, recall it
    #
    # we call this multiple times so we can preferentially select a high-level unit as advisor
    [role]
        role=advisor
        reassign=no

        side=1
        race=elf
        [not]
            id=Erlornas
        [/not]
        {MORE_CRITERIA}

        search_recall_list=yes
        [auto_recall][/auto_recall]
    [/role]
#enddef
#define GUARANTEE_ADVISOR
    # make Lomarfel our advisor, if we have him
    # if not, try Outriders, then Riders, then Scouts - those fit the dialogue and are good initial units because they can reach villages
    # if still not, give up and spawn a new Scout
    [role]
        role=advisor
        reassign=no
        id=Lomarfel
    [/role]
    {__ADVISOR type="Elvish Outrider"}
    {__ADVISOR type="Elvish Rider"}
    {__ADVISOR type="Elvish Scout"}
    [if]
        [not]
            [have_unit]
                role=advisor
            [/have_unit]
        [/not]
        [then]
            [unit]
                type=Elvish Scout
                side=1
                role=advisor
                animate=yes
                placement=leader
            [/unit]
        [/then]
    [/if]
#enddef

#define RUALSHA_COLOR
brightorange#enddef

