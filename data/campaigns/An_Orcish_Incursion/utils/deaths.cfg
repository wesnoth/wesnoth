#textdomain wesnoth-aoi

#define HERODEATHS
    #############################
    # ERLORNAS DEATH LINES
    #############################
    [event]
        name=last breath
        [filter]
            id=Erlornas
        [/filter]
        [if]
            #------------------------
            # S01 DEATH LINES
            #------------------------
            {HAVE_UNIT id=Urugha}
            [then]
                [message]
                    speaker=Erlornas
                    message= _ "Ugh..."
                [/message]
                [message]
                    speaker=Urugha
                    message= _ "Finally! Got him!"
                [/message]
                [message]
                    race=elf
                    [not]
                        id=Erlornas
                    [/not]
                    message= _ "Lord!"
                [/message]
                [message]
                    speaker=Erlornas
                    message= _ "Take... command... Drive them... away."
                [/message]
                [event]
                    name=die
                    [message]
                        speaker=narrator
                        image=wesnoth-icon.png
                        message= _ "Lord Erlornas died the day he first fought the orcs and never saw the end of the war. Given its final outcome, this was perhaps for the best."
                    [/message]
                    [endlevel]
                        result=defeat
                    [/endlevel]
                [/event]
            [/then]
            #------------------------
            # S03 DEATH LINES
            #------------------------
            [elseif]
                {HAVE_UNIT race,canrecruit=troll,yes}
                [then]
                    {GUARANTEE_ADVISOR}
                    [message]
                        speaker=second_unit
                        # wmllint: local spelling da
                        message= _ "Ha! Me smashed da funny elf. Me got a trophy!"
                    [/message]
                    [message]
                        role=advisor
                        message= _ "No! This can’t be!"
                    [/message]
                    [message]
                        speaker=narrator
                        image=wesnoth-icon.png
                        message= _ "Soon after Erlornas died, the elven party, lacking a leader and pressed from all sides, scattered and fled. Their retreat to Wesmere was arduous and long."
                    [/message]
                    [message]
                        speaker=narrator
                        message= _ "During their retreat, the pass was crossed by another army moving in the opposite direction. Orcs were back south of the pass, and this time they were to stay for a long, long time."
                        image=wesnoth-icon.png
                    [/message]
                    [endlevel]
                        result=defeat
                    [/endlevel]
                [/then]
            [/elseif]
            #------------------------
            # OTHER DEATH LINES
            #------------------------
            [else]
                [event]
                    name=die
                    [message]
                        speaker=narrator
                        image=wesnoth-icon.png
                        message= _ "Lord Erlornas never saw the blade that felled him. He died on the spot, with not a chance to issue last commands or farewells. Without him, his wardens soon fell into confusion and, losing heart, withdrew from the battle."
                    [/message]
                    [message]
                        speaker=narrator
                        image=wesnoth-icon.png
                        message= _ "When reinforcements finally arrived, elves managed to dislodge the orcish tribe. But the threat from the north remained, casting a shadow over their future."
                    [/message]
                    [endlevel]
                        result=defeat
                    [/endlevel]
                [/event]
            [/else]
        [/if]
    [/event]

    #############################
    # LINAERA DEATH LINES
    #############################
    [event]
        name=last breath
        [filter]
            id=Linaera
        [/filter]
        [message]
            speaker=Linaera
            message= _ "Alas, Erlornas, I have failed us..."
        [/message]
        [event]
            name=die
            [message]
                speaker=Erlornas
                message= _ "All is lost! Without Linaera’s help, I cannot hope to succeed!"
            [/message]
            [endlevel]
                result=defeat
            [/endlevel]
        [/event]
    [/event]

    #############################
    # LOMARFEL DEATH LINES
    #############################
    [event]
        name=last breath
        [filter]
            id=Lomarfel
        [/filter]
        [message]
            speaker=Lomarfel
            message= _ "Erlornas, you must defeat Rualsha! I have given my all..."
        [/message]
    [/event]
#enddef
