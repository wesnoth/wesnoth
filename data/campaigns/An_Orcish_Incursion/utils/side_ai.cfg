#textdomain wesnoth-aoi

#define REGROUP_MAI_DEFAULTS MAI_SETTINGS
    # can't easily use an arg for filter_retreat_targets, since a blank tag will match all units
#arg GUARDS
    role=mai_guard
#endarg
    [ai]
        recruitment_randomness=0 # low randomness/high diversity makes AI recruitment patterns more consistent and reproducible, which makes scenario difficulty more consistent and reproducible
        recruitment_diversity=99999
        leader_value=0 # high leader value makes it easy to bait the AI around by repositioning your leader. Especially abusable with fast or teleporting leaders
        village_value=0.1 # villages are important, but less so for SP AIs (who often have high base income. High village value can also cause army units to target far-away villages instead of defending our leader
        scout_village_targeting=30 # we reduced village value for army units, but we don't want to lower the scout village value - scouts should still contest villages
        grouping=no # regular grouping, combined with this mai, can sometimes cause the AI to behave too cautiously
        aggression=0.9 # when the MAI lets the default AI control a unit (while enemies are nearby), it does so because it's expecting to attack. Low aggression can sometimes result in units instead hanging around doing nothing
        [micro_ai]
            action=add
            ai_type=regroup
            {MAI_SETTINGS}
            [filter_guards]
                {GUARDS}
            [/filter_guards]
        [/micro_ai]
    [/ai]
#enddef

# some examples:
# {MODIFY_AI_DELETE_ASPECT 2,3,4 avoid "*"}
# {MODIFY_SIDE_AI (2,3,4) (grouping=defensive)}
# {MODIFY_SIDE_AI (2) ([avoid]
#     x=13-32,20-32
#     y=1-6,1-19
# [/avoid])}

#--------------------
# GOALS
#--------------------
#define GOAL_UNIT VALUE CRITERIA
    [goal]
        name=target_unit
        [criteria]
            {CRITERIA}
        [/criteria]
        value={VALUE}
    [/goal]
#enddef

#--------------------
# MODIFY AI
#--------------------
#define MODIFY_SIDE_AI SIDE MODIFICATION
    [modify_side]
        side={SIDE}
        [ai]
            {MODIFICATION}
        [/ai]
    [/modify_side]
#enddef
