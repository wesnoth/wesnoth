#textdomain wesnoth-h2tt

# This file describes the advancement tree for Lisar's elite units.
# These units are based on the HI/Fencer/Bowman, but have an extra special/ability.

# Recolor Lisar's units, to make them easier to distinguish from Asheviere's soldiers
# Use a trait instead of an object, to avoid some AI slowdowns that were happening with the old object approach (which ended up putting many copies on each unit)
#define TRAIT_MUSTHAVE_LISAR_RECOLOR PALETTE
    [trait]
        id=lisar_recolor
        availability=musthave
        [effect]
            apply_to=image_mod
            add={PALETTE}
        [/effect]
    [/trait]
#enddef

#------------------
# HEAVY INFANTRYMAN
#------------------
#define ABILITY_MARCH
    [dummy]
        id=march
        name=_"march"
        description= _ "This unit has improved movement on forest, cave, hill, mountain, frozen, and water terrain."
    [/dummy]
#enddef
#define ELITE_MARCH BASE_UNIT NEXT_UNIT
    [unit_type]
        [base_unit]
            id={BASE_UNIT}
        [/base_unit]
        id="Elite "+{BASE_UNIT}
        advances_to={NEXT_UNIT}
        # always fearless, never quick
        ignore_race_traits=yes
        # {TRAIT_MUSTHAVE_LISAR_RECOLOR} counts towards num_traits, so each elite unit has num_traits=3 instead of 2
        num_traits=3
        # Lisar's HI also are guaranteed fearless, but never have quick.
        {TRAIT_FEARLESS_MUSTHAVE}
        {TRAIT_STRONG}
        {TRAIT_INTELLIGENT}
        {TRAIT_RESILIENT}
        {TRAIT_MUSTHAVE_LISAR_RECOLOR "PAL(FFFFFF,ECECEC,A8A098,78655A,4D4541,2C2623,C5CFDA,66A5B2 > FFFFFF,ECECEC,cfc6bd,b29e92,6b574c,2C2623,ffcfda,d5c395)"}
        [abilities]
            {ABILITY_MARCH}
        [/abilities]
        [movement_costs]
            {MARCH_MOVEMENT}
        [/movement_costs]
        [defense]
            {MARCH_DEFENSE}
        [/defense]
    [/unit_type]
#enddef
{ELITE_MARCH "Heavy Infantryman" "Elite Shock Trooper"}
{ELITE_MARCH "Shock Trooper"     "Elite Iron Mauler"}
{ELITE_MARCH "Iron Mauler"       "null"}

#------------------
# FENCER
#------------------
#define ELITE_BACKSTAB BASE_UNIT NEXT_UNIT
    [unit_type]
        [base_unit]
            id={BASE_UNIT}
        [/base_unit]
        id="Elite "+{BASE_UNIT}
        advances_to={NEXT_UNIT}
        # {TRAIT_MUSTHAVE_LISAR_RECOLOR} counts towards num_traits, so each elite unit has num_traits=3 instead of 2
        num_traits=3
        {TRAIT_MUSTHAVE_LISAR_RECOLOR "PAL(FFFFFF,C6E7E7,94C6C6,638C94,31526B,182931,C5CFDA,66A5B2 > FFFFFF,ECECEC,cfc6bd,b29e92,6b574c,2C2623,ffcfda,d5c395)"}
        [attack]
            [specials]
                {WEAPON_SPECIAL_BACKSTAB}
            [/specials]
        [/attack]
    [/unit_type]
#enddef
{ELITE_BACKSTAB "Fencer"         "Elite Duelist"}
{ELITE_BACKSTAB "Duelist"        "Elite Master at Arms"}
{ELITE_BACKSTAB "Master at Arms" "null"}

#------------------
# BOWMAN
#------------------
#define ELITE_MARKSMAN BASE_UNIT NEXT_UNIT
    [unit_type]
        [base_unit]
            id={BASE_UNIT}
        [/base_unit]
        id="Elite "+{BASE_UNIT}
        advances_to={NEXT_UNIT}
        # {TRAIT_MUSTHAVE_LISAR_RECOLOR} counts towards num_traits, so each elite unit has num_traits=3 instead of 2
        num_traits=3
        {TRAIT_MUSTHAVE_LISAR_RECOLOR "PAL(FFFFFF,C6E7E7,94C6C6,638C94,31526B,182931,C5CFDA,66A5B2 > FFFFFF,ECECEC,cfc6bd,b29e92,6b574c,2C2623,ffcfda,d5c395)"}
        [attack]
        [/attack]
        [attack]
            [specials]
                {WEAPON_SPECIAL_MARKSMAN}
            [/specials]
        [/attack]
    [/unit_type]
#enddef
{ELITE_MARKSMAN "Bowman"        "Elite Longbowman"}
{ELITE_MARKSMAN "Longbowman"    "Elite Master Bowman"}
{ELITE_MARKSMAN "Master Bowman" "null"}
