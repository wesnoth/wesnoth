#textdomain wesnoth-pap

# simplified skiff with no attacks
[unit_type]
    [base_unit]
        id=Skiff
    [/base_unit]
    id=Fishing Boat
    name=_"Fishing Boat"
    cost=0 # so the AI knows this unit is worthless
    [attack]
        __remove=yes
    [/attack]
    [attack]
        __remove=yes
    [/attack]
[/unit_type]

# special case for Desolation scenario, make it able to path as necessary (combined hill/water tiles are in the way)
[unit_type]
    [base_unit]
        id=Skiff
    [/base_unit]
    id=Fishing Boat Desolation
    name=_"Fishing Boat"
    [movement_costs]
        deep_water=1
        shallow_water=2
        swamp_water=2
        reef=3
        village=1
        hills=3
    [/movement_costs]
    cost=0 # so the AI knows this unit is worthless
    [attack]
        __remove=yes
    [/attack]
    [attack]
        __remove=yes
    [/attack]
[/unit_type]
