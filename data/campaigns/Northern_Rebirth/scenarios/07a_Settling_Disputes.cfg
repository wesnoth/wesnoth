#textdomain wesnoth-nr

[scenario]
    id=07_Settling_Disputes
    name= _ "Settling Disputes"
    map_file=07a_Settling_Disputes.map
    {TURNS 25 20 15}
    next_scenario=08a_Elvish_Princess

    {DEFAULT_SCHEDULE}

    {INTRO_AND_SCENARIO_MUSIC "knolls.ogg" "frantic.ogg"}
    {EXTRA_SCENARIO_MUSIC "knalgan_theme.ogg"}
    {EXTRA_SCENARIO_MUSIC "siege_of_laurelmor.ogg"}

    # He won't be talking like this for long...
    [story]
        [part]
            story= _ "Tallin and his men made an orderly withdrawal into the caves, the orcs pressing close behind them."
        [/part]
        [part]
            story= _ "The dwarves were more than ready for them, however, and as soon as the humans got through the defenses the well-prepared dwarves fell on the battle-weary and bloodied orcs."
        [/part]
        [part]
            story= _ "Wave after wave of orcs crashed onto the dwarven defenses only to be shattered."
        [/part]
        [part]
            story= _ "As the battle raged on, Tallin again made council with Hamel."
        [/part]

        {STORY_PART_HAMEL (_ "How did ye fare?")}

        {STORY_PART_TALLIN (_ "It was fierce and bloody. We fought them for three days and nights. Every time we killed an orc, it seemed that two more would take his place. We most assuredly cannot win fighting like this.")}

        {STORY_PART_HAMEL (_ "So you withdrew. Rightly done, me lad. Our prepared defenses will be able to hold the orcs off far longer and with less loss than ye could ha’ done in the open field. I see that my training of you hasna’ been for naught.")}

        {STORY_PART_TALLIN (_ "And I am grateful — but what should we do from here? The number of humans and dwarves is limited, unlike the orcs whose numbers seem unlimited.")}

        {STORY_PART_HAMEL (_ "Aye. But we must utterly crush this orcish host if we are to ever ha’ peace.")}

        {STORY_PART_HAMEL (_ "Orcs are fickle; if we negotiated a treaty with them — assuming they would accept — it would just be broken as soon as the next warlord arose among them.")}

        {STORY_PART_TALLIN (_ "Then what shall we do? Can we assassinate this Rakshas fellow and throw them into disarray once more?")}

        #po: "coil" meant, in Middle and Early Modern English, a difficulty
        #po: or problem.
        {STORY_PART_HAMEL (_ "That will be very difficult. We did that last time and they will no doubt be alert to that threat now. Anyway, it would be but a temporary solution. Soon another strong leader would come along, and we’d find oursel’ back in the same coil.")}

        {STORY_PART_TALLIN (_ "Well, back to the drawing board. What should we do?")}

        {STORY_PART_HAMEL (_ "I think we should try to gather more allies. That way we can engage them on many fronts, or divide them into smaller groups, or cut them off from their supplies. The possibilities are endless.")}

        {STORY_PART_TALLIN (_ "Wise words, but who is there in these wild Northlands that might aid us?")}

        {STORY_PART_HAMEL (_ "You can count the elves out. They are a selfish lot, only interested in themselves. They would only aid us if something drastic happened to them and they needed our help. What about Wesnoth?")}

        {STORY_PART_TALLIN (_ "Wesnoth is too far away, and we have no idea what political state they are in.")}

        {STORY_PART_TALLIN (_ "The last news we heard of them was years ago when Prince Konrad passed through here. At that time the evil Queen Asheviere was ruling, and it was said that she was in alliance with the orcs.")}

        {STORY_PART_TALLIN (_ "And then that Princess Li’sar was in hot pursuit of Konrad as well. I wonder what became of them.")}

        {STORY_PART_HAMEL (_ "The last time any dwarf set eyes on Konrad was when he set out to the eastern tunnels in search of the Sceptre of Fire, so he could claim his place as ruler.")}

        {STORY_PART_TALLIN (_ "Geez, what a fool’s quest. Everyone in these Northlands knows that the Sceptre is long gone.")}

        #there is possibility to make Alliance with Wesnoth - unsure but they are tried way riskied options before
        #What about Drakes? --> Krash?
        #Trying to make contact with Stalrag is also a possible option even without mages.

        {STORY_PART_TALLIN (_ "But we’re meandering. Where can we find allies in these wild Northlands?")}

        {STORY_PART_HAMEL (_ "We can try to find my good friend Stalrag. He is — or was anyway, haven’t heard from him in years — the chief o’ the villages that lay along Highbrook Pass.")}

        {STORY_PART_HAMEL (_ "Ogres and gryphons have long terrorized Stalrag and his people.")}

        {STORY_PART_FATHER_MORVIN (_ "Remember, Hamel, there are often two sides to a story like this. Perhaps they see your dwarves as invaders. How would you feel if say... the elves decided to come in and level Knalga so they can grow another big forest on top?")}

        {STORY_PART_HAMEL (_ "Those filthy elves! I’ll...")}

        {STORY_PART_FATHER_MORVIN (_ "See?")}

        {STORY_PART_HAMEL (_ "Father Morvin, what are you trying to say?")}

        {STORY_PART_FATHER_MORVIN (_ "I propose that we go to Highbrook Pass and see how matters stand for ourselves. If the ogres are still alive, we might be able to persuade them to help us. What’s more, if Stalrag is still around we could use his help too.")}

        {STORY_PART_TALLIN (_ "That sounds really good. What do you think, Hamel?")}

        {STORY_PART_HAMEL (_ "Hrmph. These are desperate times. If someone will agree to help, I guess we’ll nae have any other choice but to accept.")}

        #why? gold make valuable target but may be used in hiring mercanairies
        {STORY_PART_HAMEL (_ "Ye’ll need to travel light to reach Highbrook Pass before the orcs mount another assault in force. I think ye should take as little gold as possible. We’ll store the rest in the tunnels furthest away from the attacking orcs in case they break through.")}

        {STORY_PART_TALLIN (_ "So it shall be. Now how exactly do we get to this mountain pass?")}
    [/story]

    [story]
        [part]
            story= _ "And so Tallin and his party set out."
            {NR_BIGMAP}
            {REVOLT_STAGE5}
            show_title=yes
        [/part]
    [/story]


    # Players side
    [side]
        side=1
        controller=human
        recruit=Thug,Poacher,Spearman,Bowman,Footpad
        gold=0 #player has large carryover here, is handled in prestart event
        team_name=alliance
        user_team_name= _ "Alliance"

        {CHARACTER_STATS_TALLIN}

        fog=no
        share_vision=all
        facing=se
    [/side]

    #  Dwarves
    [side]
        side=2
        controller=ai
        recruit=Dwarvish Ulfserker, Dwarvish Guardsman , Dwarvish Fighter, Dwarvish Scout , Dwarvish Thunderer
        {GOLD 100 90 60}
        team_name=knalgans
        user_team_name= _ "Knalgans"
        {FLAG_VARIANT knalgan}

        type=Dwarvish Lord
        id=Stalrag
        name= _ "Stalrag"
        profile=portraits/Stalrag.webp
        canrecruit=yes

        [modifications]
            {TRAIT_HEALTHY}
            {TRAIT_LOYAL}
        [/modifications]

        hitpoints=50
        fog=yes
        share_vision=all
        facing=se

        # Place some combatants at various states of hp/xp
        {NOTRAIT_UNIT 2 "Dwarvish Ulfserker" 28 8}
        [+unit]
            hitpoints=12
            experience=40
            facing=se
        [/unit]

        {NOTRAIT_UNIT 2 "Dwarvish Ulfserker" 24 7}
        [+unit]
            hitpoints=34
            experience=8
            facing=ne
        [/unit]

        {NOTRAIT_UNIT 2 "Dwarvish Ulfserker" 24 4}
        [+unit]
            hitpoints=28
            experience=18
            facing=sw
        [/unit]

        {NOTRAIT_UNIT 2 "Dwarvish Guardsman " 23 2}
        [+unit]
            hitpoints=30
            experience=16
            facing=s
        [/unit]

        {NOTRAIT_UNIT 2 "Dwarvish Ulfserker" 30 7}
        [+unit]
            hitpoints=12
            experience=16
            facing=nw
        [/unit]

        {NOTRAIT_UNIT 2 "Dwarvish Ulfserker" 22 6}
        [+unit]
            hitpoints=9
            experience=41
            facing=sw
        [/unit]
    [/side]

    # Enemy AI, not bad but uncooperative guy, setting it to ignore combat/movement evaluation to force it to use recruit list in full
    [side]
        side=3
        controller=ai
        recruit=Gryphon,Young Ogre,Ogre,Troll Whelp,Troll,Troll Rocklobber
        {GOLD 950 1100 1600}
        team_name=ogres
        persistent=no
        user_team_name= _ "Ogres"
        {FLAG_VARIANT ragged}

        type=Ogre
        id=Trakark
        name=_ "Trakark"
        canrecruit=yes
        facing=nw

        {NOTRAIT_UNIT 3 Troll 30 9}
        [+unit]
            hitpoints=36
            experience=14
            facing=nw
        [/unit]

        {NOTRAIT_UNIT 3 "Young Ogre" 28 6}
        [+unit]
            hitpoints=6
            experience=31
            facing=se
        [/unit]

        {NOTRAIT_UNIT 3 "Young Ogre" 20 7}
        [+unit]
            hitpoints=12
            experience=12
            facing=ne
        [/unit]

        {NOTRAIT_UNIT 3 "Ogre" 23 3}
        [+unit]
            hitpoints=27
            experience=8
            facing=n
        [/unit]
    [/side]


    {STARTING_VILLAGES 1 6}
    {STARTING_VILLAGES 2 6}
    {STARTING_VILLAGES 3 7}


    [event]
        name=prestart

        # Store player's carryover gold and give him initial starting gold
        [store_gold]
            side=1
            variable=stored_gold
        [/store_gold]
        [modify_side]
            side=1
            {GOLD 200 100 80}
        [/modify_side]

        # Recall heroes
        {RECALL_SUPPORTER}
        
        [recall]
            id=Father Morvin
        [/recall]

        [recall]
            id=Sister Thera
        [/recall]

        {RECALL_OR_REPLACE id=Krash}

        {RECALL_OR_REPLACE id=Abhai}

        {RECALL_OR_REPLACE id=Camerin}

        {RECALL_OR_REPLACE id=Elenia}

        {MODIFY_UNIT side=1 facing se}

        [objectives]
            side=1
            [objective]
                description= _ "Move Tallin next to Stalrag"
                condition=win
            [/objective]
            [objective]
                description= _ "Move Father Morvin next to Trakark"
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Tallin"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Trakark"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start
        [set_variable]
            name=Stalrag_conviced
            value=no
        [/set_variable]
        [set_variable]
            name=Trakark_conviced
            value=no
        [/set_variable]
        [message]
            speaker=Tallin
            message= _ "Hold it! What’s going on here?"
        [/message]
        [message]
            speaker=Stalrag
            message= _ "We build a good road there, but ogres and gryphons had been attacking us."
        [/message]
        [message]
            speaker=Trakark
            message= _ "This our home. You intruders!"
        [/message]
        [message]
            speaker=Father Morvin
            message= _ "Oh... I see. But we come on more pressing business. We are in desperate need of your help. Here is Tallin from the community of Dwarven Doors. As you know, the people of Dwarven Doors were enslaved by the orcs for many years. They have broken their chains and together with Lord Hamel from Knalga, they are beginning to reclaim Knalga from the chaos that it was in."
        [/message]
        [message]
            speaker=Stalrag
            message= _ "So? What does this have to do with me?"
        [/message]
        [message]
            speaker=Father Morvin
            message= _ "The orcs are on the rise again and they are threatening to complete their conquest of Knalga and convert it into an orcish stronghold. We can’t let that happen! That’s why we have come here, to seek your help."
        [/message]
        [message]
            speaker=Stalrag
            message= _ "Help me to defeat ogres and I will help you."
        [/message]
        [message]
            speaker=Father Morvin
            message= _ "We can gain help also from ogres."
        [/message]
        [message]
            speaker=Stalrag
            message= _ "You are friends with ogres? I will defeat you as well then."
        [/message]
        [message]
            speaker=Trakark
            message= _ "Trakark smahs intruders!"
        [/message]
        [message]
            speaker=Tallin
            message= _ "We need to get them to listen us"
        [/message]
    [/event]


    #Tallin moves next to Stalrag
    [event]
        name=enter hex
			[filter]
				id=Tallin
				[filter_adjacent]
					id=Stalrag
				[/filter_adjacent]
            [/filter]
        [message]
            speaker=Tallin
            message= _ "Chief Stalrag, it is said that to save a family, we should be willing to sacrifice one person; to save a town we should be willing to sacrifice a family; and to save a nation we should be willing to sacrifice a town."
        [/message]

        [message]
            speaker=Tallin
            message= _ "Now, Stalrag, it is up to you. Do you want to save Knalga or not?"
        [/message]

        [message]
            speaker=Stalrag
            message= _ "Well Tallin, if you put it that way... We don’t like it, but if that’s what is needed to save Knalga, we shall do it."
        [/message]
        [modify_side]
            side=2
            controller=null
        [/modify_side]
        [modify_unit]
            [filter]
                side=2
            [/filter]
                side=1
                moves=5
            [/modify_unit]
        [modify_unit]
            [filter]
                id=Stalrag
            [/filter]
                canrecruit=no
            [/modify_unit]
        [set_variable]
            name=Stalrag_conviced
            value=yes
        [/set_variable]
        [message]
            speaker=Tallin
            message= _ "Thank you, Stalrag. I am sure that the sacrifice of you and your people will always be remembered."
        [/message]

        [message]
            speaker=Stalrag
            message= _ "(<i>Mumbles</i>) Yeah, great compensation..."
        [/message]
    [/event]

    #Father Morvin moves next to Trakark
     [event]
        name=enter hex
			[filter]
				id=Father Morvin
				[filter_adjacent]
					id=Trakark
				[/filter_adjacent]
            [/filter]
        [message]
            speaker=Father Morvin
            message= _ "Please, my friend, listen. We have come here, to seek your help."
        [/message]
        [message]
            speaker=Trakark
            message= _ "You help? Dwarves attack our home!"
        [/message]
        [message]
            speaker=Tallin
            message= _ "I hereby make a solemn oath: no man or dwarf shall ever set foot on your land without your leave. If any of my men violates this law they shall be punished with death, and I believe I may speak for Hamel in this as well."
        [/message]
        [message]
            speaker=Trakark
            message= _ "You help us! We help you."
        [/message]
        [modify_side]
            side=3
            team_name=alliance
            user_team_name=_ "Alliance"
        [/modify_side]
        [if]
            [variable]
                name=Stalrag_conviced
                equals=yes
            [/variable]
        [then]
            [endlevel]
                result=victory
                bonus=yes
                {NEW_GOLD_CARRYOVER 40}
            [/endlevel]
        [/then]
        [elseif]
            [have_unit]
                id=Stalrag
            [/have_unit]
            [then]
                [message]
                    speaker=Tallin
                    message= _ "We need to convice Stalrag, then we can return to Knalga."
                [/message]
            [/then]
        [/elseif]
        [else]
            [endlevel]
                result=victory
                bonus=yes
                {NEW_GOLD_CARRYOVER 40}
            [/endlevel]
        [/else]
    [/if]        
    [/event]


    #Stalrag death No lose anymore
    [event]
        name=last breath
        [filter]
            id=Stalrag
        [/filter]

        [message]
            speaker=Stalrag
            message= _ "Farewell, my friends. I now go to join my fallen brethren."
        [/message]

        [message]
            speaker=Tallin
            message= _ "No! If Stalrag dies now none of his men will follow us."
        [/message]
        [if]
            [variable]
                name=Trakark_conviced
                equals=yes
            [/variable]
        [then]
            [message]
                speaker=Trakark
                message= _ "We help you"
            [/message]
            [endlevel]
                result=victory
                bonus=yes
                {NEW_GOLD_CARRYOVER 40}
            [/endlevel]
        [/then]
    [/if]
    [/event]

    #Trakark's deth equals defeat
    [event]
        name=last breath
        [filter]
            id=Trakark
        [/filter]

        [message]
            speaker=Trakark
            message= _ "Trakark too weak."
        [/message]

        [message]
            speaker=Tallin
            message= _ "No! Without him we can't recruit gryphons and ogres."
        [/message]
            [endlevel]
                result=defeat
            [/endlevel]
    [/event]

    #Victory event
    [event]
        name=victory
            [message]
                speaker=Tallin
                message= _ "My thanks. However, I have sufficient forces under my control presently and I think that merging our forces will just create confusion. Your gryphons will be of use, but I think you should retain command of your trolls and ogres, until they are needed."
            [/message]
            [message]
                speaker=Trakark
                message= _ "Okay"
            [/message]
            #Store Trakark, he may be needed in last scenario
            #No kill, he is in ally side
            [store_unit]
                    [filter]
                        id=Trakark
                    [/filter]
                    variable=Trakark_stored
                    kill=no
            [/store_unit]
            [message]
                speaker=Tallin
                message= _ "Great. Now let’s get back to the caves and start planning the best way teach those orcs a lesson they will never forget!"
            [/message]
        {CLEAR_VARIABLE Trakark_conviced} 
        {CLEAR_VARIABLE Stalrag_conviced}
    [/event]

    # Load standard death events
    {HERODEATH_TALLIN}
    {HERODEATH_CAMERIN}
    {HERODEATH_KRASH}
    {HERODEATH_ELENIA}
    {HERODEATH_THERA_AND_MORVIN_NO_DIALOG}

    {SUPPORTER_DEATH_HANDLER}

[/scenario]
