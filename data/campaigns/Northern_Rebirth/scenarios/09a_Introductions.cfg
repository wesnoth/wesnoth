#textdomain wesnoth-nr

# This scenario takes only place if the rescue in the previous one did work out.
# It's only for the talk

[scenario]
    id=09a_Introductions
    name= _ "Introductions"
    map_file=05a_02_Dealings.map
    turns=-1
    next_scenario=10a_Stolen_Gold
    victory_when_enemies_defeated=no

    {UNDERGROUND}

    {SCENARIO_MUSIC       "revelation.ogg"}
    {EXTRA_SCENARIO_MUSIC "the_dangerous_symphony.ogg"}
    {EXTRA_SCENARIO_MUSIC "underground.ogg"}

    [story]
        [if]
            [have_unit]
                id=Eryssa
            [/have_unit]
            [then]
                [part]
                    story=  _ "After rescuing the Princess, Tallin and his allies quickly withdrew into the caves."
                [/part]

                {STORY_PART_ERYSSA ( _ "Now that we are well shot of that dungeon, do you mind telling me who you are?")}
                
            #In case player has Elenia alive
        [if]
            [have_unit]
                id=Elenia
            [/have_unit]
            [then]
                {STORY_PART_ELENIA (_ "Sister! Don’t you recognize me?")}
                {STORY_PART_ERYSSA ( _ "Gods of Light! Elenia! It’s you! It has been years! What in the world happened to you? We all had thought you dead!")}
                {STORY_PART_ELENIA ( _ "Yes, I was afraid that would be your conclusion. What actually happened was that I was captured by an old bonebag of a lich.")}
                {STORY_PART_ERYSSA (_  "You mean Malifor?")}
                {STORY_PART_ELENIA ( _ "None other. I was his prisoner for many years until these brave people rescued me. With all these orcs about it was far too dangerous to travel back to the elvish forests by myself. And in consideration of the debt I owe to these brave people, I have been with them ever since.")}
                {STORY_PART_ERYSSA ( _ "Really, and who are these people?")}
                {STORY_PART_ELENIA ( _ "Here we have our leader and hero, Lord Tallin.")}
                {STORY_PART_TALLIN (_ "(<i>Rolls eyes</i>)")}
                {STORY_PART_ELENIA ( _ "He is the one who led his people in revolt against the orcs armed with nothing but pitchforks. Then they scrounged up bows and cudgels from the dead orcs, and marched into the caves and broke the dwarves out from their encirclement by the undead and trolls. 
                Then Lord Tallin and his band hunted down Malifor and destroyed him. He is now building an alliance of humans, dwarves, dead mages and whatever critters he can find to crush the orcs.")}
                {STORY_PART_ERYSSA ( _ "You’re right, Elenia, Tallin is truly a hero.")}
                {STORY_PART_TALLIN (_ "Not at all, Your Highness. I am no more than a humble peasant trying to free my people from enslavement.")}
                {STORY_PART_ERYSSA ( _ "And a modest one too!")}
                {STORY_PART_TALLIN (_  "Ahh, it was nothing, my lady.")}
                {STORY_PART_ERYSSA ( _ "No, it was far from nothing, Tallin. The Northern Elves will always be in your debt. Tell me, what can we do to repay you?")}
                {STORY_PART_TALLIN (_ "As Elenia has said, we are currently locked in a death-struggle with the orcs led by a warlord named Rakshas. You could help us most by joining us in our quest to crush this menace once and for all.")}
                #Eryssa isn't honest there. If player failed to keep Elenia alive, Eryssa starts badmouth people instead of joining alliance against Rakhas
                {STORY_PART_ERYSSA ( _  "Tallin, not only have you freed me and my sister from captivity, but you have defeated Malifor, who has long been a scourge to my people. By defeating him, you have aided the Northern Elves more than you can imagine.")}
                {STORY_PART_ERYSSA ( _ "Well and nobly spoken, Tallin. Very well, I shall join you in your quest to crush this orcish menace. Let gryphons immediately be sent to our people; I shall use all the influence I have, to raise elvish troops for the battles ahead.")}
                {STORY_PART_TALLIN ( _ "My lady, we are not seeking to do business here: <i>“I do this for you, and you do this for me.”</i> No, we seek to build everlasting friendships which will forever ensure the peace and prosperity of these Northlands. Therefore, let there be no talk of debts and repayments between us.")}
                {STORY_PART_ELENIA ( _ "Er, Eryssa... there is a large elvish force moving this direction. By now they cannot be more than two days’ march from here. It seems that our father sent them to either free you or bargain for your release.")}
                {STORY_PART_ERYSSA ( _ "Why did you not speak of this before? Let us immediately send out the gryphons with my personal seal telling them that I shall be taking command of the force. Tell them to come straight to Knalga and meet me there.")}
                {STORY_PART_TALLIN (_  "Sounds good— I mean, let it be so.")} 
                {STORY_PART_TALLIN (_  "Well, it’s pointless to linger here. Let’s get back to Knalga")}
                {VARIABLE eryssa_hostile no}
            [/then]
             [else]
                {STORY_PART_TALLIN (_  "Not at all. I am Tallin, from the human town of Dwarven Doors. Together with the Dwarvish Lord Hamel and the mage Ro’Arthian and his brother, we are attempting to restore peace and freedom to Knalga.")} 
                {STORY_PART_ERYSSA ( _ "Uh huh. Good for you.")}
                {STORY_PART_TALLIN (_  "The only problem — or the major one, anyway — is these blasted orcs. They all have united under the leadership of this guy called Rakshas and are determined to make Knalga into an orcish stronghold — enslaving or killing any humans, dwarves or anything else along the way.")}
                {STORY_PART_ERYSSA ( _ "So what does this have to do with me?")}
                {STORY_PART_TALLIN (_  "There is a large elvish force not far from here who — we believe anyway — has been sent to free you. We were hoping if we could secure your release you would help us crush the orcish host.")}
                {STORY_PART_ERYSSA ( _ "Pff, foolish human. What in the world gave you that idea?")} 
                {STORY_PART_TALLIN ( _ "Well, what about the orcs then, <i>Princess</i>? Don’t you wish to be rid of them?")}
                {STORY_PART_ERYSSA (_  "How we deal with the orcs is none of your concern!")}
                {STORY_PART_FATHER_MORVIN (_ "Frankly, my lady, I am disappointed. I was always under the impression that elves were an honorable lot who took their debts seriously.")}
                #Eryssa is lying, elves will send only 1500 gold to player in scenario 10, not 5000
                {STORY_PART_ERYSSA ( _ "Who said that I wasn’t going to repay you? When I get back to the elves, we will give you five thousand gold for your trouble")}
                {STORY_PART_TALLIN (_  "Well, it’s pointless to linger here. Let’s get back to Knalga")}
            [/else]
        [/if]
                [/then]
                #If not Eryssa
                [else]
                    [part]
                        story= _ "After failed attemp to save Elvish princess, Tallin and his forces returned to Knalga."
                    [/part]
                [/else]
            [/if]
        [part]
            story= _ "Upon arriving there something seemed to be wrong. Instead of being boisterously hailed by the dwarves as before, they were met by silent guards with downcast eyes."
        [/part]
        [part]
            story= _ "Fearing the worst, Tallin rushed to find Hamel."
            {NR_BIGMAP}
            {RECOVERY_STAGE3}
            music=sad.ogg
        [/part]

    [side]
        side=1
        controller=human
        recruit=Thug,Poacher,Spearman,Bowman,Gryphon,Dwarvish Fighter,Dwarvish Thunderer,Dwarvish Ulfserker,Dwarvish Scout,Footpad
        team_name=knalgans
        user_team_name=_ "Knalgans"

        {CHARACTER_STATS_TALLIN}

        shroud=yes
    [/side]

    # Dwarven side
    [side]
        side=2
        controller=ai
        team_name=rebels
        user_team_name= _ "Dwarves"
        {FLAG_VARIANT knalgan}

        type=Dwarvish Lord
        id=Hamel
        name= _ "Hamel"
        persistant=yes
        profile=portraits/Hamel.webp
        canrecruit=yes
        [modifications]
            {TRAIT_STRONG}
            [object]
                silent=yes
                [effect]
                    apply_to=new_ability
                    [abilities]
                        {ABILITY_LEADERSHIP}
                    [/abilities]
                [/effect]
            [/object]
        [/modifications]

        facing=se
        # No shroud this time

        {NOTRAIT_UNIT 2 "Dwarvish Stalwart" 10 5} {GUARDIAN} {FACING se}
        {NOTRAIT_UNIT 2 "Dwarvish Stalwart" 13 7} {GUARDIAN} {FACING se}

        [unit]
            type=Dwarvish Steelclad
            id=Galim
            name= _ "Galim"
            x,y=12,11
            facing=se
            random_traits=no
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
    [/side]

    

    [event]
        name=prestart


        {RECALL_SUPPORTER}

        [recall]
            id=Camerin
        [/recall]

        [recall]
            id=Father Morvin
        [/recall]

        [recall]
            id=Sister Thera
        [/recall]

        [recall]
            id=Krash
        [/recall]

        [recall]
            id=Elenia
        [/recall]

        [if]
            [have_unit]
                #wmllint: recognize Eryssa
                id=Eryssa
                search_recall_list=yes
            [/have_unit]
            [then]
                [recall]
                    id=Eryssa
                [/recall]
            [/then]
        [/if]

        [recall]
            id=Stalrag
        [/recall]


        # Set objectives
        [objectives]
            side=1
            [objective]
                description= _ "Talk with Hamel"
                condition=win
            [/objective]

            [objective]
                description= _ "Death of Tallin"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Eryssa"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=80
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start
        {MESSAGE Tallin (_ "Hamel, what is wrong?! Why is everyone acting so strangely?")}

        {MESSAGE Hamel (_ "We are deeply ashamed of ourselves, Tallin. We ha’ failed the trust that ye gave us.")}

        {MESSAGE Tallin (_ "What do you mean?")}

        {MESSAGE Hamel (_ "Yer gold, Tallin, we failed to protect it.")}

        {MESSAGE Tallin (_ "My gold!? Why, what happened? Start from the beginning.")}

        {MESSAGE Hamel (_ "No sooner had ye left then the orcs once again launched a massive assault.")}

        {MESSAGE Hamel (_ "Such a massive and fierce assault it was that we had to call upon all our reserves. When that proved insufficient, we had nae other choice then to call some dwarves off the other defenses.")}

        {MESSAGE Hamel (_ "It was a ploy. Nae sooner than we ha’ thinned the ranks of the northern defenders, a small force of trolls smashed through the defenses and made their way straight for your gold.")}

        {MESSAGE Hamel (_ "We beat them back, but not before they made off with your entire stock of gold.")}

        {MESSAGE Hamel (_ "I am sorry, Tallin, we did all that we could. I would we could ha’ done more.")}

        {MESSAGE Tallin (_ "Oh no! Rakshas will raise many troops with that gold!")}

        {MESSAGE Hamel (_ "Aye. Well I ken it, Tallin.")}

        [switch]
            variable=eryssa_hostile
            [case]
                value=yes

                {MESSAGE Eryssa (_ "See, you wretched human! At least now you will appreciate the generosity of the elves.")}

                [if]
                    [have_unit]
                        id=Camerin
                    [/have_unit]
                    [then]
                        [message]
                            speaker=Camerin
                            message= _ "What a little priss. She makes me want to fry her!"
                        [/message]

                        [message]
                            speaker=Eryssa
                            message= _ "Mind your betters, mage!"
                        [/message]

                        [message]
                            speaker=Camerin
                            message= _ "Mind your tongue, elf!"
                        [/message]
                    [/then]
                [/if]

                {MESSAGE Hamel (_ "Who is this annoying chit?")}

                {MESSAGE Tallin (_ "This is the famous and benevolent Princess Eryssa, in whose rescue we sacrificed many lives and <i>much</i> gold.")}

                {MESSAGE Eryssa (_ "That’s it! I have had enough from you worthless rabble. I will soon send a rider with the promised gold, and in the meantime, I’m leaving!")}

                {MESSAGE Stalrag (_ "Begone and good riddance, brat!")}

                {MESSAGE Tallin (_ "Back to the issue of the stolen gold, were you able to pursue the trolls?")}
            [/case]
            [case]
                value=no

                {MESSAGE Tallin (_ "Were you able to pursue them?")}
            [/case]
            [else]
                # Eryssa dead

                {MESSAGE Tallin (_ "This isn’t looking good. Not only do we fail to get the Princess but now we lost all of our gold! Seriously Hamel, I don’t know if we’re gonna make it.")}

                {MESSAGE Hamel (_ "Don’t give in to despair, Tallin. At least you prevented the orcs from getting the ransom money.")}

                {MESSAGE Tallin (_ "Yeah, they ran off with all the rest of our gold instead.")}

                {MESSAGE Hamel (_ "Snap out of it Tallin! We are not in control of fate. We will do all we can to the best of our ability and leave the results to the gods.")}

                {MESSAGE Tallin (_ "You’re right, Hamel, sorry. Were you able to pursue the trolls?")}
            [/else]
        [/switch]

        {MESSAGE Hamel (_ "Och, we tried, Tallin, but with the orcs still pressing our southern defenses and trolls trying to break through everywhere, we simply ha’ not the power.")}

        {MESSAGE Tallin (_ "How long ago did the trolls make off with the gold?")}

        {MESSAGE Hamel (_ "It couldna’ ha’ been more than a day now.")}

        {MESSAGE Tallin (_ "Then we shall pursue them. Even if we don’t catch them then we might be able to hit Rakshas before he has had a chance to put that gold to good use.")}

        {MESSAGE Tallin (_ "Hamel, rally the dwarves and prepare to make an all-out offensive against the orcs. It’s time to give them some of their own.")}

        {MESSAGE Tallin (_ "We will follow the trail of the trolls; it should lead us back to Rakshas.")}

        [if]
            [variable]
                name=eryssa_hostile
                equals=no
            [/variable]
            [then]
                {MESSAGE Tallin (_ "Eryssa, what news of the elves?")}

                {MESSAGE Eryssa (_ "Our gryphons have reached them. They are no more than a few days march from us.")}

                {MESSAGE Eryssa (_ "I will send another message to them asking them to send out scouts to locate the trolls who took your gold. Mayhap the elves will be able to get between the trolls and their allies.")}
            [/then]
            [else]
                {MESSAGE Hamel (_ "It is well thought. May the Bright Gods be with you.")}
            [/else]
        [/if]

        {MESSAGE Tallin (_ "So it shall be. Hamel, when I make contact with the orcs I’ll send you a message. When you get it, come at all speed. It is near time for the battle that will decide all.")}

        {MESSAGE Hamel (_ "The axes and hammers o’ every dwarf thirst for the blood of the orcs!")}

                
          

    # Load death events
    {HERODEATH_EVERYONE}
[/scenario]
