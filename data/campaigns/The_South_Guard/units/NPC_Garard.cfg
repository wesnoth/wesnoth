#textdomain wesnoth-tsg
#define FRAME WML
    # <-- newline
    [frame]
        {WML}
    [/frame]
#enddef
[unit_type]
    id=King of Wesnoth
    name= _ "King of Wesnoth"
    race=human
    profile="portraits/garard.webp"
    description=_""
    hitpoints=105
    cost=233
    movement_type,movement=mounted,7
    undead_variation=mounted
    level,experience=5,250
