#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent_location]adjacent,count=
##
# Actions:
# Give Alice an ability specialX, which is only active if one or more of adjacents terrains are Gg.
# Test whether the ability is active.
##
# Expected end state:
# specialX should be active.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "filter_adjacent_location_without_count_active" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active one or more terrains hexes are Gg"
                        value=100
                        apply_to=self
                        [filter_adjacent_location]
                            adjacent=n,ne,se,s,sw,nw
                            terrain=Gg
                        [/filter_adjacent_location]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        {ASSERT (
            [have_unit]
                ability_id_active=specialX
            [/have_unit]
        )}

        {SUCCEED}
    [/event]
)}
