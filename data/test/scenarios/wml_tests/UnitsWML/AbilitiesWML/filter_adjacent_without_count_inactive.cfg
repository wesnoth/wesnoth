#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count=
##
# Actions:
# Give Alice an ability specialX, which is intended to only be active if one adjacent unit is bob, however omit the 'count'.
# Test whether the ability is active.
##
# Expected end state:
# specialX should be inactive because omitting the 'count' means all of the adjacent hexes need to match.
# A deprecation warning is triggered (a BROKE_STRICT result).
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "filter_adjacent_without_count_inactive" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if all adjacent hexes contain bob"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            adjacent=n,ne,se,s,sw,nw
                            id=bob
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        {ASSERT (
            [not]
                [have_unit]
                    ability_id_active=specialX
                [/have_unit]
            [/not]
        )}

        {SUCCEED}
    [/event]
)}
