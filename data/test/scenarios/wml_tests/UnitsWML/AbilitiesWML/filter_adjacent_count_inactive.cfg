#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count=
##
# Actions:
# Give Alice an ability specialX, which is only active if two or more adjacent unit is bob.
# Test whether the ability is active.
##
# Expected end state:
# specialX should be inactive because one unit only is bob.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "filter_adjacent_count_inactive" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if two or more until 6 of the adjacents units is bob"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            adjacent=n,ne,se,s,sw,nw
                            id=bob
                            count=2-6
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        {ASSERT (
            [not]
                [have_unit]
                    ability_id_active=specialX
                [/have_unit]
            [/not]
        )}

        {SUCCEED}
    [/event]
)}
