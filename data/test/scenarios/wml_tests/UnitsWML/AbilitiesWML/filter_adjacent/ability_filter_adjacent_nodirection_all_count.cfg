#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count,race=
##
# Actions:
# Give Alice an ability specialX, which is only active if there are orcs in whatever directions are the default.
# Spawn 3 additional orcs to make that potentially true, if the default is any nearby hex.
# Test whether the ability is active.
##
# Expected end state:
# specialX should be inactive on Wesnoth 1.18. The default for adjacent is empty.
# Different behavior can be defined for 1.20, because this is meanless in 1.18.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "ability_filter_adjacent_nodirection_all_count" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if there are orcs in every direction"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            count=6
                            race=orc
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        [for]
            start=1
            end=3
            [do]
                [unit]
                    type=Orcish Grunt
                    location_id=1
                    side=1
                [/unit]
            [/do]
        [/for]

        {ASSERT (
            [not]
                [have_unit]
                    ability_id_active=specialX
                [/have_unit]
            [/not]
        )}

        {SUCCEED}
    [/event]
)}

