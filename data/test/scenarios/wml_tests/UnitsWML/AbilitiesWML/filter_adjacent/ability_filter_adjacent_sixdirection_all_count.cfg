#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count,race=
##
# Actions:
# Give Alice an ability specialX, which is only active if there are orcs in every direction
# Spawn 3 additional orcs to make that true.
# Test whether the ability is active, explicitly passing all six directions as adjacent.
##
# Expected end state:
# specialX should be active.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "ability_filter_adjacent_sixdirection_all_count" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if there are orcs in every direction"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            adjacent=n,ne,nw,s,se,sw
                            count=6
                            race=orc
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        [for]
            start=1
            end=3
            [do]
                [unit]
                    type=Orcish Grunt
                    location_id=1
                    side=1
                [/unit]
            [/do]
        [/for]

        {ASSERT (
            [have_unit]
                ability_id_active=specialX
            [/have_unit]
        )}

        {SUCCEED}
    [/event]
)}


