#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count=
##
# Actions:
# Give Alice an ability specialX, which is only active if Bob in the hexes south and south-west of Alice
# Test whether the ability is active.
##
# Expected end state:
# specialX should be inactive, there's only one Bob.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "ability_filter_adjacent_multiple_mixed_hexcount" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if Bob in the hexes south and south-west of Alice"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            adjacent=s,sw
                            count=2
                            id=bob
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        {ASSERT (
            [not]
                [have_unit]
                    ability_id_active=specialX
                [/have_unit]
            [/not]
        )}

        {SUCCEED}
    [/event]
)}
