#textdomain wesnoth-test

#####
# API(s) being tested: ability[filter_adjacent]adjacent,count,race=
##
# Actions:
# Give Alice an ability specialX, which is only active if there is an orc south of Alice
# Test whether the ability is active.
##
# Expected end state:
# On 1.18, specialX is inactive, because omitting count= automatically fails.
#
# Wesnoth 1.20 could generate a deprecation warning about the omitted count=, or it
# could special-case omitting the count when adjacent is exactly one direction.
#####
{COMMON_KEEP_A_B_C_D_UNIT_TEST "ability_filter_adjacent_single_all_nocount" (
    [event]
        name=start

        [object]
            silent=yes
            [effect]
                apply_to=new_ability
                [abilities]
                    [damage]
                        id=specialX
                        name=_ "specialX"
                        description=_ "specialX is active if and only if there is an orc south of Alice"
                        value=100
                        apply_to=self
                        [filter_adjacent]
                            adjacent=s
                            race=orc
                        [/filter_adjacent]
                    [/damage]
                [/abilities]
            [/effect]
            [filter]
                id=alice
            [/filter]
        [/object]

        {ASSERT (
			[not]
				[have_unit]
					ability_id_active=specialX
				[/have_unit]
			[/not]
        )}

        {SUCCEED}
    [/event]
)}

