#textdomain wesnoth-test
#####
# API(s) being tested: [effect]apply_to=new_ability
##
# Actions:
# Two different[chance_to_hit] abilities are added by two [effect]apply_to=new_ability, setting the chance to 0 and 100 respectively and with same id.
# Have alice attack bob.
##
# Expected end state:
# All strikes for both units hit.
#####
{COMMON_KEEP_A_B_UNIT_TEST "test_add_different_abilities_with_same_id" (
    [event]
        name = start

        {SET_HP VALUE=1000}

        [modify_unit]
            [filter]
            [/filter]
            [effect]
                apply_to = new_ability
                [abilities]
                    {TEST_ABILITY attacks 100 () SELF=yes}
                    [chance_to_hit]
                        id=test_cth_1
                        value=0
                    [/chance_to_hit]
                [/abilities]
            [/effect]
            [effect]
                apply_to = new_ability
                [abilities]
                    [chance_to_hit]
                        id=test_cth_1
                        value=100
                    [/chance_to_hit]
                [/abilities]
            [/effect]
        [/modify_unit]
    [/event]

    {CHECK_STRIKES "100,100" ({SUCCEED}) (CHANCE_TO_HIT=)}
)}
