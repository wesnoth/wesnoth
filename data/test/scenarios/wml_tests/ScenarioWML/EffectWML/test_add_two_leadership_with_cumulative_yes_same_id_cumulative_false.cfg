# wmllint: no translatables

#####
# API(s) being tested: [effect]apply_to=new_ability,cumulative=no
##
# Actions:
# Give all units 50% self-leadership bonus damage with cumulative=yes
# Try to give anew all units 50% self-leadership bonus damage with cumulative=yes
# Both abilities have the same id
# Attack each other
##
# Expected end state:
# The damage from the attack is increased by 50% because the option cumulative=no(by default) don't allows for the addition of the same ability twice.
#####
{COMMON_KEEP_A_B_UNIT_TEST "test_add_two_leadership_with_cumulative_yes_same_id_cumulative_false" (
    [event]
        name = start

        [modify_unit]
            [filter]
            [/filter]
            [effect]
                apply_to = new_ability
                cumulative=no
                [abilities]
                    {TEST_ABILITY leadership 50 () ID=1 CUMULATIVE=yes SELF=yes}
                [/abilities]
            [/effect]
            [effect]
                apply_to = new_ability
                cumulative=no
                [abilities]
                    {TEST_ABILITY leadership 50 () ID=1 CUMULATIVE=yes SELF=yes}
                [/abilities]
            [/effect]
        [/modify_unit]

        {ATTACK_AND_VALIDATE 150}
        {SUCCEED}
    [/event]
)}
