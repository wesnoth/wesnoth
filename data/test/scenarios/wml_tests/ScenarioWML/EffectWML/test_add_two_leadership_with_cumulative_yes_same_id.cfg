# wmllint: no translatables

#####
# API(s) being tested: [effect]apply_to=new_ability used two times
##
# Actions:
# Give all units 25% self-leadership bonus damage with cumulative=yes
# Give anew all units 25% self-leadership bonus damage with cumulative=yes
# Both abilities have the same id
# Attack each other
##
# Expected end state:
# The damage from the attack is increased by 50%
#####
{COMMON_KEEP_A_B_UNIT_TEST "test_add_two_leadership_with_cumulative_yes_same_id" (
    [event]
        name = start

        [modify_unit]
            [filter]
            [/filter]
            [effect]
                apply_to = new_ability
                [abilities]
                    {TEST_ABILITY leadership 25 () ID=1 CUMULATIVE=yes SELF=yes}
                [/abilities]
            [/effect]
            [effect]
                apply_to = new_ability
                [abilities]
                    {TEST_ABILITY leadership 25 () ID=1 CUMULATIVE=yes SELF=yes}
                [/abilities]
            [/effect]
        [/modify_unit]

        {ATTACK_AND_VALIDATE 150}
        {SUCCEED}
    [/event]
)}
