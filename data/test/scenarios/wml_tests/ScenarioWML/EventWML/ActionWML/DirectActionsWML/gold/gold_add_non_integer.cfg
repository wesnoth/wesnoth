#textdomain wesnoth-test

#####
# API(s) being tested: [gold]amount=
##
# Actions:
# Subtract 200 gold from side2, so that we test both positive and negative gold
# Add gold to both sides, but in non-integer amounts
# Check how much was given to each side in total
##
# Expected end state:
# The total was rounded toward zero after each individual [gold] action
#####
#ifndef SCHEMA_VALIDATION
{GENERIC_UNIT_TEST "gold_add_non_integer" (
    [event]
        name=start

        [gold]
            amount=-200
            side=2
        [/gold]

        # confirm initial gold amounts
        [store_gold]
            side=1
            variable=initial_gold_side1
        [/store_gold]
        [store_gold]
            side=2
            variable=initial_gold_side2
        [/store_gold]

        {ASSERT (
            [variable]
                name=initial_gold_side1
                numerical_equals=100
            [/variable]
        )}
        {ASSERT (
            [variable]
                name=initial_gold_side2
                numerical_equals=-100
            [/variable]
        )}

        # Give gold. The behavior of 1.18.8 is that the total rounds towards zero;
        # that is, it matches the rules for static_cast<int>(calculation done as float).
        # For positive gold, adding 1.8 adds 1.
        # For negative gold, adding 1.8 adds 2.
        [for]
            start=1
            end=6
            [do]
                [gold]
                    amount=1.8
                    side=1,2
                [/gold]
            [/do]
        [/for]

        [store_gold]
            side=1
            variable=after_calc_gold_side1
        [/store_gold]
        [store_gold]
            side=2
            variable=after_calc_gold_side2
        [/store_gold]

        {ASSERT (
            [variable]
                name=after_calc_gold_side1
                numerical_equals=106
            [/variable]
        )}
        {ASSERT (
            [variable]
                name=after_calc_gold_side2
                numerical_equals=-88
            [/variable]
        )}

        {SUCCEED}
    [/event]
)}
#endif
